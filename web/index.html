<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabSim 3.0 - Generador de Perfil de Paciente</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/form-components.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>🎧 LabSim 3.0</h1>
            <p>Generador de Perfil de Paciente Audiológico</p>
        </div>

        <div class="main-content">
            <!-- Barra de Progreso -->
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">Paso 1 de 10</div>
            </div>

            <!-- Sistema de Tabs -->
            <div class="tabs-container">
                <div class="tabs-header" id="tabsHeader">
                    <!-- Los tabs se generan dinámicamente -->
                </div>

                <!-- Contenido de las Fichas -->
                <div class="tabs-content" id="tabsContent">
                    <!-- El contenido se carga dinámicamente -->
                </div>
            </div>

            <!-- Navegación -->
            <div class="navigation">
                <button class="btn btn-secondary" id="prevBtn" disabled>
                    ← Anterior
                </button>
                <div class="nav-info">
                    <span id="currentTabName">Información Básica</span>
                </div>
                <button class="btn btn-primary" id="nextBtn">
                    Siguiente →
                </button>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <p>Cargando módulo...</p>
        </div>

        <!-- Notifications -->
        <div class="notification-container" id="notificationContainer">
            <!-- Las notificaciones aparecen aquí -->
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="js/core/app.js"></script>
    <script src="js/core/tab-manager.js"></script>
    <script src="js/core/notification-manager.js"></script>
</body>
</html>
