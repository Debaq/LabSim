<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412"><defs><marker id="pf" markerWidth="6" markerHeight="6" refX="4" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" transform="scale(.8)" fill="#24101a"/></marker><marker id="pr" markerWidth="6" markerHeight="6" refX="4" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" transform="scale(.8)" fill="#c62f3a"/></marker><marker id="pv" markerWidth="6" markerHeight="6" refX="4" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" transform="scale(.8)" fill="#21796c"/></marker><marker id="pc" markerWidth="6" markerHeight="6" refX="4" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" transform="scale(.8)" fill="#c0571c"/></marker></defs><rect width="760" height="412" fill="#fff"/><text x="14.0" y="20.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.6" fill="#24101a" text-anchor="start" font-weight="700">Modelo neurofisiológico del acúfeno (Jastreboff)</text><rect x="24.0" y="150.0" width="130.0" height="80.0" rx="8" fill="#f3f1ec" stroke="#24101a" stroke-width="1.4"/><text x="89.0" y="187.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">Fuente</text><text x="89.0" y="201.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">señal neuronal anómala</text><text x="89.0" y="212.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">cóclea y vía auditiva</text><rect x="210.0" y="150.0" width="140.0" height="80.0" rx="8" fill="#fbeadf" stroke="#c0571c" stroke-width="1.4"/><text x="280.0" y="187.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#c0571c" text-anchor="middle" font-weight="700">Detección</text><text x="280.0" y="201.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">centros subcorticales</text><text x="280.0" y="212.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">la señal se registra</text><rect x="410.0" y="150.0" width="150.0" height="80.0" rx="8" fill="#fbeadf" stroke="#c0571c" stroke-width="1.4"/><text x="485.0" y="187.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#c0571c" text-anchor="middle" font-weight="700">Percepción</text><text x="485.0" y="201.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">corteza auditiva</text><text x="485.0" y="212.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">"oigo un sonido"</text><rect x="210.0" y="40.0" width="140.0" height="70.0" rx="8" fill="#fbe3e4" stroke="#c62f3a" stroke-width="1.4"/><text x="280.0" y="72.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#c62f3a" text-anchor="middle" font-weight="700">Sistema límbico</text><text x="280.0" y="86.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">miedo, ansiedad, atención</text><rect x="410.0" y="40.0" width="150.0" height="70.0" rx="8" fill="#fbe3e4" stroke="#c62f3a" stroke-width="1.4"/><text x="485.0" y="72.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#c62f3a" text-anchor="middle" font-weight="700">Sistema autónomo</text><text x="485.0" y="86.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">alerta, insomnio, tensión</text><rect x="600.0" y="150.0" width="140.0" height="80.0" rx="8" fill="#fbe3e4" stroke="#c62f3a" stroke-width="1.4"/><text x="670.0" y="187.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#c62f3a" text-anchor="middle" font-weight="700">Reacción</text><text x="670.0" y="201.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">molestia, sufrimiento</text><text x="670.0" y="212.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">el acúfeno "importa"</text><line x1="154.0" y1="190.0" x2="208.0" y2="190.0" stroke="#24101a" stroke-width="1.6" marker-end="url(#pf)"/><line x1="350.0" y1="190.0" x2="408.0" y2="190.0" stroke="#24101a" stroke-width="1.6" marker-end="url(#pf)"/><line x1="560.0" y1="190.0" x2="598.0" y2="190.0" stroke="#24101a" stroke-width="1.6" marker-end="url(#pf)"/><line x1="280.0" y1="148.0" x2="280.0" y2="112.0" stroke="#c62f3a" stroke-width="1.6" marker-end="url(#pr)"/><line x1="485.0" y1="148.0" x2="485.0" y2="112.0" stroke="#c62f3a" stroke-width="1.6" marker-end="url(#pr)"/><line x1="350.0" y1="75.0" x2="408.0" y2="75.0" stroke="#c62f3a" stroke-width="1.6" marker-end="url(#pr)"/><path d="M670,232 L670,268 L280,268 L280,232" fill="none" stroke="#c62f3a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#pr)"/><text x="475.0" y="284.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#c62f3a" text-anchor="middle" font-weight="700">refuerzo: cuanto más reacciona, más se detecta y más se percibe</text><rect x="24.0" y="318.0" width="340.0" height="84.0" rx="8" fill="#e3f1ee" stroke="#21796c" stroke-width="1.2"/><text x="36.0" y="336.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#21796c" text-anchor="start" font-weight="700">Consejería (educación)</text><text x="36.0" y="351.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.0" fill="#24101a" text-anchor="start" font-weight="400">Actúa sobre la reacción: el acúfeno pasa de amenaza a</text><text x="36.0" y="363.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.0" fill="#24101a" text-anchor="start" font-weight="400">estímulo neutro, y las conexiones con el límbico y el</text><text x="36.0" y="375.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.0" fill="#24101a" text-anchor="start" font-weight="400">autónomo se debilitan (habituación de la reacción).</text><rect x="396.0" y="318.0" width="340.0" height="84.0" rx="8" fill="#fbeadf" stroke="#c0571c" stroke-width="1.2"/><text x="408.0" y="336.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#c0571c" text-anchor="start" font-weight="700">Terapia sonora (enriquecimiento)</text><text x="408.0" y="351.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.0" fill="#24101a" text-anchor="start" font-weight="400">Actúa sobre el contraste: un sonido de fondo baja la fuerza</text><text x="408.0" y="363.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.0" fill="#24101a" text-anchor="start" font-weight="400">de la señal frente al ruido y facilita que el cerebro</text><text x="408.0" y="375.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.0" fill="#24101a" text-anchor="start" font-weight="400">la deje de percibir (habituación de la percepción).</text><line x1="194.0" y1="316.0" x2="280.0" y2="232.0" stroke="#21796c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#pv)"/><line x1="566.0" y1="316.0" x2="480.0" y2="232.0" stroke="#c0571c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#pc)"/></svg>