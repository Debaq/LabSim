<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370"><defs><marker id="p-flujo" markerWidth="6" markerHeight="6" refX="4" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" transform="scale(.8)" fill="#c62f3a"/></marker></defs><rect width="760" height="370" fill="#fff"/><text x="14.0" y="20.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.6" fill="#24101a" text-anchor="start" font-weight="700">A · El ángulo de la válvula</text><line x1="90.0" y1="250.0" x2="90.0" y2="100.0" stroke="#24101a" stroke-width="3"/><line x1="90.0" y1="250.0" x2="126.3" y2="104.5" stroke="#c0571c" stroke-width="3"/><path d="M 90,180 A 70 70 0 0 1 106.9,182.1" fill="none" stroke="#c62f3a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="118.0" y="168.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#c62f3a" text-anchor="start" font-weight="700">10 a 15°</text><text x="80.0" y="210.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="end" font-weight="600">tabique</text><text x="134.3" y="108.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#c0571c" text-anchor="start" font-weight="600">cartílago lateral superior</text><text x="94.0" y="268.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">aire</text><line x1="120.0" y1="262.0" x2="120.0" y2="240.0" stroke="#21796c" stroke-width="2"/><text x="14.0" y="290.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Corte frontal, esquema.</text><text x="14.0" y="302.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Si el ángulo se cierra, el pasaje se estrecha.</text><text x="280.0" y="20.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.6" fill="#24101a" text-anchor="start" font-weight="700">B · Resistencia contra radio</text><line x1="300.0" y1="242.0" x2="500.0" y2="242.0" stroke="#cfccc5" stroke-width="1"/><line x1="300.0" y1="52.0" x2="300.0" y2="242.0" stroke="#cfccc5" stroke-width="1"/><polyline points="316.7,90.0 318.3,101.6 320.0,112.1 321.7,121.6 323.3,130.3 325.0,138.2 326.7,145.4 328.3,152.0 330.0,158.1 331.7,163.6 333.3,168.7 335.0,173.4 336.7,177.7 338.3,181.7 340.0,185.4 341.7,188.8 343.3,191.9 345.0,194.9 346.7,197.6 348.3,200.1 350.0,202.4 351.7,204.6 353.3,206.6 355.0,208.5 356.7,210.3 358.3,212.0 360.0,213.5 361.7,215.0 363.3,216.3 365.0,217.6 366.7,218.8 368.3,219.9 370.0,221.0 371.7,222.0 373.3,222.9 375.0,223.8 376.7,224.6 378.3,225.4 380.0,226.2 381.7,226.9 383.3,227.5 385.0,228.1 386.7,228.7 388.3,229.3 390.0,229.8 391.7,230.3 393.3,230.8 395.0,231.3 396.7,231.7 398.3,232.1 400.0,232.5 401.7,232.9 403.3,233.2 405.0,233.6 406.7,233.9 408.3,234.2 410.0,234.5 411.7,234.8 413.3,235.0 415.0,235.3 416.7,235.5 418.3,235.7 420.0,236.0 421.7,236.2 423.3,236.4 425.0,236.6 426.7,236.8 428.3,236.9 430.0,237.1 431.7,237.3 433.3,237.4 435.0,237.6 436.7,237.7 438.3,237.8 440.0,238.0 441.7,238.1 443.3,238.2 445.0,238.3 446.7,238.5 448.3,238.6 450.0,238.7 451.7,238.8 453.3,238.9 455.0,239.0 456.7,239.1 458.3,239.1 460.0,239.2 461.7,239.3 463.3,239.4 465.0,239.5 466.7,239.5 468.3,239.6 470.0,239.7 471.7,239.7 473.3,239.8 475.0,239.9 476.7,239.9 478.3,240.0 480.0,240.0 481.7,240.1 483.3,240.1 485.0,240.2 486.7,240.2 488.3,240.3 490.0,240.3 491.7,240.4 493.3,240.4 495.0,240.4 496.7,240.5 498.3,240.5 500.0,240.6" fill="none" stroke="#c0571c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="316.7" y1="242.0" x2="316.7" y2="246.0" stroke="#cfccc5" stroke-width="1"/><text x="316.7" y="258.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">1/2</text><line x1="400.0" y1="242.0" x2="400.0" y2="246.0" stroke="#cfccc5" stroke-width="1"/><text x="400.0" y="258.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">1</text><line x1="483.3" y1="242.0" x2="483.3" y2="246.0" stroke="#cfccc5" stroke-width="1"/><text x="483.3" y="258.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">1,5</text><line x1="296.0" y1="232.5" x2="300.0" y2="232.5" stroke="#cfccc5" stroke-width="1"/><text x="292.0" y="235.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-weight="400">1</text><line x1="296.0" y1="194.5" x2="300.0" y2="194.5" stroke="#cfccc5" stroke-width="1"/><text x="292.0" y="197.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-weight="400">5</text><line x1="296.0" y1="147.0" x2="300.0" y2="147.0" stroke="#cfccc5" stroke-width="1"/><text x="292.0" y="150.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-weight="400">10</text><line x1="296.0" y1="90.0" x2="300.0" y2="90.0" stroke="#cfccc5" stroke-width="1"/><text x="292.0" y="93.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-weight="400">16</text><text x="400.0" y="274.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">radio del pasaje (1 = el de partida)</text><text x="292.0" y="42.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">resistencia</text><circle cx="316.7" cy="90.0" r="4.5" fill="#fff" stroke="#c62f3a" stroke-width="1.8"/><circle cx="400.0" cy="232.5" r="4.5" fill="#fff" stroke="#c62f3a" stroke-width="1.8"/><text x="326.7" y="104.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#c62f3a" text-anchor="start" font-weight="700">mitad del radio: 16 veces</text><text x="406.0" y="224.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="600">punto de partida</text><text x="280.0" y="300.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Tubo rígido de flujo laminar: R crece como 1/r⁴.</text><text x="280.0" y="312.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">La nariz real es más compleja; la tendencia es la misma.</text><text x="535.0" y="20.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.6" fill="#24101a" text-anchor="start" font-weight="700">C · Estrechez y presión</text><path d="M 545,70 L 605,70 Q 645,70 665,100 Q 685,70 725,70" fill="none" stroke="#24101a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M 545,170 L 605,170 Q 645,170 665,140 Q 685,170 725,170" fill="none" stroke="#24101a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="553.0" y1="86.0" x2="599.0" y2="86.0" stroke="#21796c" stroke-width="1.4"/><line x1="639.0" y1="107.1" x2="691.0" y2="107.1" stroke="#21796c" stroke-width="2.8"/><line x1="695.0" y1="86.0" x2="721.0" y2="86.0" stroke="#21796c" stroke-width="1.4"/><line x1="553.0" y1="106.0" x2="599.0" y2="106.0" stroke="#21796c" stroke-width="1.8"/><line x1="639.0" y1="114.7" x2="691.0" y2="114.7" stroke="#21796c" stroke-width="3.2"/><line x1="695.0" y1="106.0" x2="721.0" y2="106.0" stroke="#21796c" stroke-width="1.8"/><line x1="553.0" y1="134.0" x2="599.0" y2="134.0" stroke="#21796c" stroke-width="1.8"/><line x1="639.0" y1="125.3" x2="691.0" y2="125.3" stroke="#21796c" stroke-width="3.2"/><line x1="695.0" y1="134.0" x2="721.0" y2="134.0" stroke="#21796c" stroke-width="1.8"/><line x1="553.0" y1="154.0" x2="599.0" y2="154.0" stroke="#21796c" stroke-width="1.4"/><line x1="639.0" y1="132.9" x2="691.0" y2="132.9" stroke="#21796c" stroke-width="2.8"/><line x1="695.0" y1="154.0" x2="721.0" y2="154.0" stroke="#21796c" stroke-width="1.4"/><text x="575.0" y="58.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">lento</text><text x="665.0" y="58.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#21796c" text-anchor="middle" font-weight="700">rápido</text><text x="575.0" y="194.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">presión mayor</text><text x="665.0" y="194.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#c62f3a" text-anchor="middle" font-weight="700">presión menor</text><line x1="665.0" y1="103.0" x2="665.0" y2="117.0" stroke="#c62f3a" stroke-width="2.4" marker-end="url(#p-flujo)"/><text x="535.0" y="230.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="600">Si la pared es blanda, la presión menor</text><text x="535.0" y="243.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="600">tira de ella hacia dentro:</text><text x="535.0" y="256.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="600">colapso inspiratorio.</text><text x="535.0" y="275.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Solo la idea: la nariz es más compleja y su</text><text x="535.0" y="287.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">flujo es en parte turbulento.</text><text x="14.0" y="352.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Tres ideas de física sobre un mismo punto, la válvula nasal. Esquemas, no mediciones.</text></svg>