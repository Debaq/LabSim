font-size="9" fill="#8a8a90" text-anchor="start" font-weight="400">El deslizamiento es la señal de error que el cerebelo usa para recalibrar la ganancia del reflejo. Sin mover la cabeza no hay error, y sin error no hay adaptación.</text><text x="14.0" y="244.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#24101a" text-anchor="start" font-weight="700">B. Los tres ejercicios, vistos desde arriba</text><rect x="28.0" y="256" width="224" height="190" rx="0" fill="#faf9f6" stroke="#e7e5e0" stroke-width="1"/><text x="140.0" y="276.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#c62f3a" text-anchor="middle" font-weight="700">x1</text><circle cx="140.0" cy="360.0" r="26" fill="#f3e6d8" stroke="#24101a" stroke-width="1.4"/><polyline points="135.0,336.0 140.0,328.0 145.0,336.0" fill="none" stroke="#24101a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="140.0" cy="292.0" r="6" fill="#24101a" stroke="#24101a" stroke-width="1.2"/><line x1="100.0" y1="338.0" x2="180.0" y2="338.0" stroke="none" stroke-width="0" stroke-linecap="round"/><path d="M106.0,324 A34,34 0 0 1 174.0,324" fill="none" stroke="#2b5fa8" stroke-width="1.8" marker-end="url(#pa)"/><text x="140.0" y="316.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#2b5fa8" text-anchor="middle" font-weight="400">cabeza</text><text x="140.0" y="428.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#24101a" text-anchor="middle" font-weight="600">Blanco quieto, cabeza gira</text><text x="140.0" y="442.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8a8a90" text-anchor="middle" font-weight="400">el ojo debe ir contra la cabeza</text><rect x="270.0" y="256" width="224" height="190" rx="0" fill="#faf9f6" stroke="#e7e5e0" stroke-width="1"/><text x="382.0" y="276.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#c62f3a" text-anchor="middle" font-weight="700">x2</text><circle cx="382.0" cy="360.0" r="26" fill="#f3e6d8" stroke="#24101a" stroke-width="1.4"/><polyline points="377.0,336.0 382.0,328.0 387.0,336.0" fill="none" stroke="#24101a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="412.0" cy="292.0" r="6" fill="#24101a" stroke="#24101a" stroke-width="1.2"/><line x1="412.0" y1="302.0" x2="434.0" y2="302.0" stroke="#24101a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#pt)"/><text x="444.0" y="306.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#24101a" text-anchor="start" font-weight="400">blanco</text><path d="M348.0,324 A34,34 0 0 1 416.0,324" fill="none" stroke="#2b5fa8" stroke-width="1.8" marker-start="url(#pa)"/><text x="346.0" y="316.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#2b5fa8" text-anchor="end" font-weight="400">cabeza</text><text x="382.0" y="428.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#24101a" text-anchor="middle" font-weight="600">Blanco y cabeza se mueven en sentido contrario</text><text x="382.0" y="442.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8a8a90" text-anchor="middle" font-weight="400">la imagen resbala el doble de rápido</text><rect x="512.0" y="256" width="224" height="190" rx="0" fill="#faf9f6" stroke="#e7e5e0" stroke-width="1"/><text x="624.0" y="276.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#21796c" text-anchor="middle" font-weight="700">Sustitución</text><circle cx="624.0" cy="360.0" r="26" fill="#f3e6d8" stroke="#24101a" stroke-width="1.4"/><polyline points="619.0,336.0 624.0,328.0 629.0,336.0" fill="none" stroke="#24101a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="584.0" cy="292.0" r="6" fill="#24101a" stroke="#24101a" stroke-width="1.2"/><circle cx="664.0" cy="292.0" r="6" fill="#24101a" stroke="#24101a" stroke-width="1.2"/><line x1="624.0" y1="360.0" x2="584.0" y2="298.0" stroke="#21796c" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3" marker-end="url(#pv)"/><text x="624.0" y="316.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#21796c" text-anchor="middle" font-weight="400">primero el ojo, después la cabeza</text><text x="624.0" y="428.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#24101a" text-anchor="middle" font-weight="600">El ojo salta al blanco antes que la cabeza</text><text x="624.0" y="442.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8a8a90" text-anchor="middle" font-weight="400">no repara el reflejo: lo reemplaza</text></svg>