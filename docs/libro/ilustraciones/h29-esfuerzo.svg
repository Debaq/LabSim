<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360"><defs></defs><rect width="740" height="360" fill="#fff"/><text x="14.0" y="20.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.0" fill="#24101a" text-anchor="start" font-weight="700">A · Presiones en la vía aérea al espirar a la fuerza</text><text x="400.0" y="20.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.0" fill="#24101a" text-anchor="start" font-weight="700">B · Tres esfuerzos distintos, la misma curva al final</text><circle cx="48" cy="80" r="22" fill="#fff" stroke="#24101a" stroke-width="1.6"/><text x="48.0" y="84.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#24101a" text-anchor="middle" font-weight="400">alvéolo</text><rect x="70" y="72" width="260" height="16" fill="#fff" stroke="#24101a" stroke-width="1.6"/><rect x="200.0" y="77" width="130.0" height="6" fill="#c62f3a" opacity=".35"/><line x1="200.0" y1="62.0" x2="200.0" y2="98.0" stroke="#c62f3a" stroke-width="1.6" stroke-dasharray="3 2"/><text x="200.0" y="58.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#c62f3a" text-anchor="middle" font-weight="700">punto de igual presión</text><text x="265.0" y="110.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#c62f3a" text-anchor="middle" font-weight="400">vía aérea comprimida</text><text x="336.0" y="84.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">boca</text><text x="30.0" y="36.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="700">esfuerzo moderado: P pleural 10 cmH₂O · P alveolar 20 cmH₂O</text><text x="70.0" y="130.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">presión en la vía aérea: de 20 cmH₂O en el alvéolo a 0 en la boca</text><circle cx="48" cy="220" r="22" fill="#fff" stroke="#24101a" stroke-width="1.6"/><text x="48.0" y="224.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#24101a" text-anchor="middle" font-weight="400">alvéolo</text><rect x="70" y="212" width="260" height="16" fill="#fff" stroke="#24101a" stroke-width="1.6"/><rect x="135.0" y="217" width="195.0" height="6" fill="#c62f3a" opacity=".35"/><line x1="135.0" y1="202.0" x2="135.0" y2="238.0" stroke="#c62f3a" stroke-width="1.6" stroke-dasharray="3 2"/><text x="135.0" y="198.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#c62f3a" text-anchor="middle" font-weight="700">punto de igual presión</text><text x="232.5" y="250.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#c62f3a" text-anchor="middle" font-weight="400">vía aérea comprimida</text><text x="336.0" y="224.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">boca</text><text x="30.0" y="176.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="700">esfuerzo máximo: P pleural 30 cmH₂O · P alveolar 40 cmH₂O</text><text x="70.0" y="270.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">presión en la vía aérea: de 40 cmH₂O en el alvéolo a 0 en la boca</text><text x="30.0" y="330.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">La presión dentro de la vía aérea cae de la alveolar a cero en la boca. Donde iguala a la presión pleural, la vía</text><text x="30.0" y="342.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">aérea empieza a comprimirse. Hasta ese punto el aire lo empuja solo la retracción elástica del pulmón (10 cmH₂O en el ejemplo):</text><text x="30.0" y="354.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">esfuerzo mayor aumenta la presión pleural, pero no cambia esa presión motriz.</text><line x1="440.0" y1="40.0" x2="440.0" y2="270.0" stroke="#e7e5e0" stroke-width="1"/><text x="440.0" y="283.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">0</text><line x1="494.0" y1="40.0" x2="494.0" y2="270.0" stroke="#e7e5e0" stroke-width="1"/><text x="494.0" y="283.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">1</text><line x1="548.0" y1="40.0" x2="548.0" y2="270.0" stroke="#e7e5e0" stroke-width="1"/><text x="548.0" y="283.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">2</text><line x1="602.0" y1="40.0" x2="602.0" y2="270.0" stroke="#e7e5e0" stroke-width="1"/><text x="602.0" y="283.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">3</text><line x1="656.0" y1="40.0" x2="656.0" y2="270.0" stroke="#e7e5e0" stroke-width="1"/><text x="656.0" y="283.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">4</text><line x1="710.0" y1="40.0" x2="710.0" y2="270.0" stroke="#e7e5e0" stroke-width="1"/><text x="710.0" y="283.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">5</text><line x1="440.0" y1="270.0" x2="710.0" y2="270.0" stroke="#e7e5e0" stroke-width="1"/><text x="435.0" y="273.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-weight="400">0</text><line x1="440.0" y1="228.2" x2="710.0" y2="228.2" stroke="#e7e5e0" stroke-width="1"/><text x="435.0" y="231.2" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-we