<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400"><defs></defs><rect width="760" height="400" fill="#fff"/><text x="14.0" y="20.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.6" fill="#24101a" text-anchor="start" font-weight="700">Lo que se usa en la rinoscopía anterior</text><path d="M 40,110 L 110,102 L 110,142 L 40,136 Z" fill="#dcdcdf" stroke="#24101a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M 110,102 L 148,106 L 148,142 L 110,142 Z" fill="#bdbdc2" stroke="#24101a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="148.0" cy="124.0" r="5" fill="#fff" stroke="#24101a" stroke-width="1.5"/><path d="M 148,120 Q 210,90 255,70" fill="none" stroke="#24101a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 148,128 Q 210,160 255,180" fill="none" stroke="#24101a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 148,120 Q 210,90 255,70" fill="none" stroke="#dcdcdf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M 148,128 Q 210,160 255,180" fill="none" stroke="#dcdcdf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M 190,110 Q 170,124 190,138" fill="none" stroke="#c0571c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="150.0" y="222.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">Espéculo nasal bivalvo</text><text x="150.0" y="236.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.8" fill="#8a8a90" text-anchor="middle" font-weight="400">Las valvas abren; los mangos quedan</text><text x="150.0" y="248.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.8" fill="#8a8a90" text-anchor="middle" font-weight="400">en la mano que lo sostiene.</text><ellipse cx="240.0" cy="285.0" rx="38" ry="30" fill="#fff" stroke="#cfccc5" stroke-width="1"/><path d="M 208,285 Q 240,250 272,285" fill="none" stroke="#24101a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M 208,285 Q 240,320 272,285" fill="none" stroke="#24101a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="240.0" y="328.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.8" fill="#8a8a90" text-anchor="middle" font-weight="400">valvas abiertas, de frente</text><path d="M 290,145 Q 360,65 430,145" fill="none" stroke="#7d7d83" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="360.0" cy="121.0" r="36" fill="#e8f0f2" stroke="#7d7d83" stroke-width="3"/><circle cx="360.0" cy="121.0" r="6" fill="#fff" stroke="#7d7d83" stroke-width="1.5"/><circle cx="360.0" cy="121.0" r="26" fill="none" stroke="#a7bcc2" stroke-width="1"/><text x="360.0" y="190.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">Espejo frontal</text><text x="360.0" y="204.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.8" fill="#8a8a90" text-anchor="middle" font-weight="400">Cóncavo y con un agujero central: miras</text><text x="360.0" y="216.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.8" fill="#8a8a90" text-anchor="middle" font-weight="400">por él mientras refleja la luz de la lámpara.</text><path d="M 560,310 L 630,310 L 622,296 L 568,296 Z" fill="#bdbdc2" stroke="#24101a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M 595,296 C 595,210 540,190 540,130" fill="none" stroke="#7d7d83" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M 540,130 L 504,94 L 552,74 L 582,114 Z" fill="#ffe9a8" stroke="#24101a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="504.0" y1="94.0" x2="440.0" y2="108.0" stroke="#c0571c" stroke-width="1.4" stroke-dasharray="5 3"/><line x1="504.0" y1="94.0" x2="448.0" y2="74.0" stroke="#c0571c" stroke-width="1.4" stroke-dasharray="5 3"/><text x="595.0" y="336.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">Lámpara de cuello flexible</text><text x="595.0" y="350.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.8" fill="#8a8a90" text-anchor="middle" font-weight="400">A un lado del paciente; el cuello flexible</text><text x="595.0" y="362.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.8" fill="#8a8a90" text-anchor="middle" font-weight="400">deja la luz apuntada sin sostenerla.</text><text x="14.0" y="392.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Esquema de los tres elementos; los modelos reales varían de forma y tamaño.</text></svg>