<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360"><defs><marker id="pf" markerWidth="6" markerHeight="6" refX="4" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" transform="scale(.8)" fill="#24101a"/></marker></defs><rect width="700" height="360" fill="#fff"/><text x="14.0" y="18.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.6" fill="#24101a" text-anchor="start" font-weight="700">Del control periódico al cambio confirmado</text><rect x="20.0" y="150.0" width="110.0" height="52.0" rx="6" fill="#eef5f2" stroke="#21796c" stroke-width="1.4"/><text x="75.0" y="166.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="700">Audiometría</text><text x="75.0" y="179.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="700">de base</text><text x="75.0" y="192.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="700">(ingreso)</text><rect x="165.0" y="150.0" width="110.0" height="52.0" rx="6" fill="#fff" stroke="#24101a" stroke-width="1.4"/><text x="220.0" y="166.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">Control</text><text x="220.0" y="179.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">periódico</text><text x="220.0" y="192.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">contra la base</text><rect x="310.0" y="150.0" width="110.0" height="52.0" rx="6" fill="#fff" stroke="#24101a" stroke-width="1.4"/><text x="365.0" y="166.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">¿Cambio mayor</text><text x="365.0" y="179.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">que el criterio</text><text x="365.0" y="192.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">de la norma?</text><rect x="310.0" y="36.0" width="110.0" height="44.0" rx="6" fill="#fff" stroke="#21796c" stroke-width="1.4"/><text x="365.0" y="54.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#21796c" text-anchor="middle" font-weight="400">Sin cambio:</text><text x="365.0" y="67.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#21796c" text-anchor="middle" font-weight="400">sigue el calendario</text><rect x="310.0" y="250.0" width="110.0" height="56.0" rx="6" fill="#fff" stroke="#24101a" stroke-width="1.4"/><text x="365.0" y="268.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">Reexplicar,</text><text x="365.0" y="281.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">recolocar fonos</text><text x="365.0" y="294.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">y repetir al tiro</text><rect x="455.0" y="250.0" width="105.0" height="56.0" rx="6" fill="#fff" stroke="#24101a" stroke-width="1.4"/><text x="507.5" y="268.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">¿Persiste?</text><text x="507.5" y="281.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">Confirmación en</text><text x="507.5" y="294.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">condiciones de base</text><rect x="455.0" y="150.0" width="105.0" height="52.0" rx="6" fill="#fff" stroke="#21796c" stroke-width="1.4"/><text x="507.5" y="166.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#21796c" text-anchor="middle" font-weight="400">Cambio</text><text x="507.5" y="179.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#21796c" text-anchor="middle" font-weight="400">no persiste</text><text x="507.5" y="192.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#21796c" text-anchor="middle" font-weight="400">(era variación)</text><rect x="598.0" y="250.0" width="92.0" height="56.0" rx="6" fill="#fbeeee" stroke="#c62f3a" stroke-width="1.4"/><text x="644.0" y="268.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="700">Revisión por</text><text x="644.0" y="281.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="700">médico o</text><text x="644.0" y="294.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="700">audiólogo</text><rect x="598.0" y="130.0" width="92.0" height="92.0" rx="6" fill="#fbeeee" stroke="#c62f3a" stroke-width="1.4"/><text x="644.0" y="153.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">Si es laboral:</text><text x="644.0" y="166.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">avisar al</text><text x="644.0" y="179.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">trabajador, revisar</text><text x="644.0" y="192.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">el puesto, protección,</text><text x="644.0" y="205.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">nueva base</text><rect x="598.0" y="40.0" width="92.0" height="62.0" rx="6" fill="#fff" stroke="#c0571c" stroke-width="1.4"/><text x="644.0" y="61.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">Si no es laboral</text><text x="644.0" y="74.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">o hay dudas:</text><text x="644.0" y="87.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="400">derivar a ORL</text><line x1="130" y1="176" x2="165" y2="176" stroke="#24101a" stroke-width="1.5" marker-end="url(#pf)"/><line x1="275" y1="176" x2="310" y2="176" stroke="#24101a" stroke-width="1.5" marker-end="url(#pf)"/><line x1="365" y1="150" x2="365" y2="80" stroke="#21796c" stroke-width="1.5" marker-end="url(#pf)"/><text x="377.0" y="115.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#21796c" text-anchor="middle" font-weight="700">no</text><line x1="365" y1="202" x2="365" y2="250" stroke="#c62f3a" stroke-width="1.5" marker-end="url(#pf)"/><text x="377.0" y="226.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#c62f3a" text-anchor="middle" font-weight="700">sí</text><line x1="420" y1="278" x2="455" y2="278" stroke="#24101a" stroke-width="1.5" marker-end="url(#pf)"/><line x1="507" y1="250" x2="507" y2="202" stroke="#21796c" stroke-width="1.5" marker-end="url(#pf)"/><text x="519.0" y="226.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#21796c" text-anchor="middle" font-weight="700">no</text><line x1="560" y1="278" x2="598" y2="278" stroke="#c62f3a" stroke-width="1.5" marker-end="url(#pf)"/><text x="579.0" y="272.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#c62f3a" text-anchor="middle" font-weight="700">sí</text><line x1="644" y1="250" x2="64