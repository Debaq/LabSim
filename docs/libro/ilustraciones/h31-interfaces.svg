101a"/><ellipse cx="648" cy="118" rx="9" ry="4.5" fill="#fff" stroke="#24101a" stroke-width="1.1"/><circle cx="648" cy="118" r="2.4" fill="#24101a"/><path d="M624,124 L618,156 Q624,162 630,156 Z" fill="none" stroke="#8a8a90" stroke-width="1"/><path d="M604,186 Q624,196 644,186" fill="none" stroke="#24101a" stroke-width="1.6"/><path d="M124,116 L100,166 Q124,176 148,166 Z" fill="#fff" fill-opacity=".8" stroke="#c0571c" stroke-width="2.4" stroke-linejoin="round"/><line x1="124.0" y1="114.0" x2="124.0" y2="88.0" stroke="#c0571c" stroke-width="5"/><line x1="103.0" y1="124.0" x2="62.0" y2="132.0" stroke="#c0571c" stroke-width="1.5"/><line x1="145.0" y1="124.0" x2="186.0" y2="132.0" stroke="#c0571c" stroke-width="1.5"/><line x1="103.0" y1="148.0" x2="62.0" y2="156.0" stroke="#c0571c" stroke-width="1.5"/><line x1="145.0" y1="148.0" x2="186.0" y2="156.0" stroke="#c0571c" stroke-width="1.5"/><ellipse cx="365" cy="159" rx="7" ry="5" fill="#fff" stroke="#c0571c" stroke-width="2.2"/><ellipse cx="383" cy="159" rx="7" ry="5" fill="#fff" stroke="#c0571c" stroke-width="2.2"/><path d="M365,156 Q374,136 383,156" fill="none" stroke="#c0571c" stroke-width="3"/><line x1="374.0" y1="140.0" x2="374.0" y2="88.0" stroke="#c0571c" stroke-width="5"/><line x1="356.0" y1="120.0" x2="312.0" y2="128.0" stroke="#c0571c" stroke-width="1.5"/><line x1="392.0" y1="120.0" x2="436.0" y2="128.0" stroke="#c0571c" stroke-width="1.5"/><line x1="356.0" y1="144.0" x2="312.0" y2="152.0" stroke="#c0571c" stroke-width="1.5"/><line x1="392.0" y1="144.0" x2="436.0" y2="152.0" stroke="#c0571c" stroke-width="1.5"/><path d="M624,116 L596,166 Q592,204 624,212 Q656,204 652,166 Z" fill="#fff" fill-opacity=".8" stroke="#c0571c" stroke-width="2.4" stroke-linejoin="round"/><line x1="624.0" y1="114.0" x2="624.0" y2="88.0" stroke="#c0571c" stroke-width="5"/><line x1="599.0" y1="124.0" x2="562.0" y2="132.0" stroke="#c0571c" stroke-width="1.5"/><line x1="649.0" y1="124.0" x2="686.0" y2="132.0" stroke="#c0571c" stroke-width="1.5"/><line x1="599.0" y1="148.0" x2="562.0" y2="156.0" stroke="#c0571c" stroke-width="1.5"/><line x1="649.0" y1="148.0" x2="686.0" y2="156.0" stroke="#c0571c" stroke-width="1.5"/><line x1="624.0" y1="88.0" x2="624.0" y2="76.0" stroke="#c0571c" stroke-width="5"/><text x="18.0" y="268.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="700">cubre la nariz</text><text x="18.0" y="281.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">exige respirar por la nariz:</text><text x="18.0" y="294.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">con la boca abierta</text><text x="18.0" y="307.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">el aire se escapa</text><text x="268.0" y="268.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="700">se apoyan en las narinas</text><text x="268.0" y="281.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">poco contacto con la cara</text><text x="268.0" y="294.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">la presión entra por las narinas;</text><text x="268.0" y="307.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">menos espacio muerto bajo la máscara</text><text x="518.0" y="268.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="700">cubre nariz y boca</text><text x="518.0" y="281.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">sirve si el paciente respira</text><text x="518.0" y="294.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">por la boca; en un estudio se</text><text x="518.0" y="307.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">asoció a presiones más altas</text><text x="14.0" y="346.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Esquemas de frente. El tubo (arriba) va al equipo; las líneas laterales son el arnés que sujeta la interfaz.</text></svg>