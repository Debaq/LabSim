<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380"><rect width="720" height="380" fill="#fff"/><text x="360.0" y="24.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#24101a" text-anchor="middle" font-weight="700">El círculo que mantiene el mareo</text><rect x="260.0" y="58.0" width="200.0" height="48.0" rx="8" fill="#fff" fill-opacity="1" stroke="#6b4a9e"/><rect x="260.0" y="58.0" width="6.0" height="48.0" rx="3" fill="#6b4a9e" fill-opacity="1" stroke="none"/><text x="363.0" y="78.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#24101a" text-anchor="middle" font-weight="700">Un evento que mareó</text><text x="363.0" y="95.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#8a8a90" text-anchor="middle" font-weight="400">neuritis, VPPB, migraña, pánico</text><rect x="490.0" y="166.0" width="200.0" height="48.0" rx="8" fill="#fff" fill-opacity="1" stroke="#c0571c"/><rect x="490.0" y="166.0" width="6.0" height="48.0" rx="3" fill="#c0571c" fill-opacity="1" stroke="none"/><text x="593.0" y="186.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#24101a" text-anchor="middle" font-weight="700">Vigilancia</text><text x="593.0" y="203.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#8a8a90" text-anchor="middle" font-weight="400">atención puesta en el cuerpo y el entorno</text><rect x="400.0" y="292.0" width="200.0" height="48.0" rx="8" fill="#fff" fill-opacity="1" stroke="#c0571c"/><rect x="400.0" y="292.0" width="6.0" height="48.0" rx="3" fill="#c0571c" fill-opacity="1" stroke="none"/><text x="503.0" y="312.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#24101a" text-anchor="middle" font-weight="700">Rigidez postural</text><text x="503.0" y="329.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#8a8a90" text-anchor="middle" font-weight="400">se tensa el tronco y las piernas, se mira fijo</text><rect x="120.0" y="292.0" width="200.0" height="48.0" rx="8" fill="#fff" fill-opacity="1" stroke="#c0571c"/><rect x="120.0" y="292.0" width="6.0" height="48.0" rx="3" fill="#c0571c" fill-opacity="1" stroke="none"/><text x="223.0" y="312.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#24101a" text-anchor="middle" font-weight="700">Peso de más a la vista</text><text x="223.0" y="329.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#8a8a90" text-anchor="middle" font-weight="400">el entorno visual y el movimiento mandan</text><rect x="30.0" y="166.0" width="200.0" height="48.0" rx="8" fill="#fff" fill-opacity="1" stroke="#c62f3a"/><rect x="30.0" y="166.0" width="6.0" height="48.0" rx="3" fill="#c62f3a" fill-opacity="1" stroke="none"/><text x="133.0" y="186.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#24101a" text-anchor="middle" font-weight="700">Síntomas</text><text x="133.0" y="203.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#8a8a90" text-anchor="middle" font-weight="400">de pie, al moverse, con mucha imagen</text><line x1="448.0" y1="104.0" x2="536.0" y2="156.0" stroke="#8a8a90" stroke-width="1.6"/><line x1="536.0" y1="156.0" x2="531.2" y2="148.4" stroke="#8a8a90" stroke-width="1.6"/><line x1="536.0" y1="156.0" x2="527.0" y2="155.4" stroke="#8a8a90" stroke-width="1.6"/><line x1="570.0" y1="216.0" x2="540.0" y2="288.0" stroke="#8a8a90" stroke-width="1.6"/><line x1="540.0" y1="288.0" x2="546.8" y2="282.1" stroke="#8a8a90" stroke-width="1.6"/><line x1="540.0" y1="288.0" x2="539.3" y2="279.0" stroke="#8a8a90" stroke-width="1.6"/><line x1="400.0" y1="316.0" x2="320.0" y2="316.0" stroke="#8a8a90" stroke-width="1.6"/><line x1="320.0" y1="316.0" x2="328.0" y2="320.1" stroke="#8a8a90" stroke-width="1.6"/><line x1="320.0" y1="316.0" x2="328.0" y2="311.9" stroke="#8a8a90" stroke-width="1.6"/><line x1="180.0" y1="288.0" x2="150.0" y2="216.0" stroke="#8a8a90" stroke-width="1.6"/><line x1="150.0" y1="216.0" x2="149.3" y2="225.0" stroke="#8a8a90" stroke-width="1.6"/><line x1="150.0" y1="216.0" x2="156.8" y2="221.9" stroke="#8a8a90" stroke-width="1.6"/><line x1="176.0" y1="168.0" x2="270.0" y2="104.0" stroke="#8a8a90" stroke-width="1.6"/><line x1="270.0" y1="104.0" x2="261.1" y2="105.2" stroke="#8a8a90" stroke-width="1.6"/><line x1="270.0" y1="104.0" x2="265.6" y2="111.9" stroke="#8a8a90" stroke-width="1.6"/><text x="360.0" y="196.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#24101a" text-anchor="middle" font-weight="700">cada vez que marea,</text><text x="360.0" y="211.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#24101a" text-anchor="middle" font-weight="700">la vigilancia sube</text><text x="360.0" y="232.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8a8a90" text-anchor="middle" font-weight="400">y el círculo se cierra</text><text x="360.0" y="366.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#8a8a90" text-anchor="middle" font-weight="400">Según la fisiopatología que describen Staab y cols. (2017) y Popkirov y cols. (2018).</text></svg>