<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290"><defs><marker id="pa" markerWidth="6" markerHeight="6" refX="4" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" transform="scale(.8)" fill="#24101a"/></marker></defs><rect width="700" height="290" fill="#fff"/><text x="14.0" y="20.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.6" fill="#24101a" text-anchor="start" font-weight="700">A · Distorsión armónica</text><line x1="50.0" y1="230.0" x2="320.0" y2="230.0" stroke="#cfccc5" stroke-width="1.2"/><text x="310.0" y="256.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="end" font-weight="400">frecuencia →</text><text x="185.0" y="44.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">salida del audífono con un tono puro de entrada</text><rect x="81" y="100" width="18" height="130" rx="1" fill="#24101a" stroke="#24101a" stroke-width="0"/><text x="90.0" y="242.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="700">f</text><rect x="141" y="190" width="18" height="40" rx="1" fill="#c62f3a" stroke="#c62f3a" stroke-width="0"/><text x="150.0" y="242.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#c62f3a" text-anchor="middle" font-weight="700">2f</text><rect x="201" y="208" width="18" height="22" rx="1" fill="#c62f3a" stroke="#c62f3a" stroke-width="0"/><text x="210.0" y="242.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#c62f3a" text-anchor="middle" font-weight="700">3f</text><rect x="261" y="219" width="18" height="11" rx="1" fill="#c62f3a" stroke="#c62f3a" stroke-width="0"/><text x="270.0" y="242.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#c62f3a" text-anchor="middle" font-weight="700">4f</text><text x="210.0" y="100.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#c62f3a" text-anchor="middle" font-weight="600">armónicos: frecuencias que</text><text x="210.0" y="112.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#c62f3a" text-anchor="middle" font-weight="600">el audífono agrega y que no estaban</text><text x="185.0" y="268.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="middle" font-weight="600">distorsión = potencia de los armónicos / potencia del fundamental</text><text x="360.0" y="20.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.6" fill="#24101a" text-anchor="start" font-weight="700">B · Ruido interno referido a la entrada</text><rect x="370" y="60" width="90" height="56" rx="4" fill="#fff" stroke="#24101a" stroke-width="1.4"/><text x="415.0" y="84.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="700">audífono</text><text x="415.0" y="98.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="middle" font-weight="400">con ganancia G</text><line x1="340" y1="88" x2="368" y2="88" stroke="#24101a" stroke-width="1.4" marker-end="url(#pa)"/><line x1="462" y1="88" x2="492" y2="88" stroke="#24101a" stroke-width="1.4" marker-end="url(#pa)"/><text x="340.0" y="76.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="end" font-weight="400">entrada:</text><text x="340.0" y="88.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="end" font-weight="400">silencio</text><text x="500.0" y="76.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">salida:</text><text x="500.0" y="88.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#c62f3a" text-anchor="start" font-weight="700">siseo propio</text><polyline points="500.0,106.0 503.0,115