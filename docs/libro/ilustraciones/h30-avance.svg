0.8"/><text x="14.0" y="322.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">La mandíbula y la base de la lengua van unidas por los músculos: al adelantar la mandíbula, la lengua se aleja de la pared posterior de la faringe.</text><text x="14.0" y="336.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Esquema; las proporciones son aproximadas. El avance real lo gradúa el dentista con el paciente, hasta el máximo que tolera.</text></svg>