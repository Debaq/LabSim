zel se estima a ojo; en la VNG, el programa la calcula tramo por tramo.</text><text x="14.0" y="418.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Positivo = derecha del paciente.</text></svg>