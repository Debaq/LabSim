<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330"><defs><marker id="p-a" markerWidth="6" markerHeight="6" refX="4" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" transform="scale(.8)" fill="#24101a"/></marker><marker id="p-r" markerWidth="6" markerHeight="6" refX="4" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" transform="scale(.8)" fill="#c62f3a"/></marker></defs><rect width="700" height="330" fill="#fff"/><text x="14.0" y="20.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.6" fill="#24101a" text-anchor="start" font-weight="700">Una cóclea con dos ventanas y con tres (cóclea desenrollada)</text><rect x="90.0" y="76.0" width="250.0" height="100.0" rx="10" fill="#f6f3ee" stroke="#24101a" stroke-width="1.6"/><line x1="96.0" y1="126.0" x2="314.0" y2="126.0" stroke="#c0571c" stroke-width="3.2"/><text x="205.0" y="139.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#c0571c" text-anchor="middle" font-weight="600">membrana basilar</text><text x="210.0" y="90.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">rampa vestibular</text><text x="210.0" y="170.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">rampa timpánica</text><line x1="90.0" y1="86.0" x2="90.0" y2="112.0" stroke="#f6f3ee" stroke-width="4"/><line x1="90.0" y1="140.0" x2="90.0" y2="166.0" stroke="#f6f3ee" stroke-width="4"/><text x="84.0" y="84.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#24101a" text-anchor="end" font-weight="700">ventana oval</text><text x="84.0" y="172.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#24101a" text-anchor="end" font-weight="700">ventana redonda</text><line x1="60.0" y1="99.0" x2="104.0" y2="99.0" stroke="#24101a" stroke-width="2.4" marker-end="url(#p-a)"/><line x1="100.0" y1="153.0" x2="60.0" y2="153.0" stroke="#24101a" stroke-width="1.4" marker-end="url(#p-a)"/><text x="326.0" y="120.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">ápex</text><line x1="150.0" y1="100.0" x2="150.0" y2="118.0" stroke="#24101a" stroke-width="2.6" marker-end="url(#p-a)"/><line x1="150.0" y1="152.0" x2="150.0" y2="134.0" stroke="#24101a" stroke-width="2.6" marker-end="url(#p-a)"/><rect x="420.0" y="76.0" width="250.0" height="100.0" rx="10" fill="#f6f3ee" stroke="#24101a" stroke-width="1.6"/><line x1="426.0" y1="126.0" x2="644.0" y2="126.0" stroke="#c0571c" stroke-width="3.2"/><text x="535.0" y="139.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#c0571c" text-anchor="middle" font-weight="600">membrana basilar</text><text x="540.0" y="90.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">rampa vestibular</text><text x="540.0" y="170.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">rampa timpánica</text><line x1="420.0" y1="86.0" x2="420.0" y2="112.0" stroke="#f6f3ee" stroke-width="4"/><line x1="420.0" y1="140.0" x2="420.0" y2="166.0" stroke="#f6f3ee" stroke-width="4"/><text x="414.0" y="84.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#24101a" text-anchor="end" font-weight="700">ventana oval</text><text x="414.0" y="172.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#24101a" text-anchor="end" font-weight="700">ventana redonda</text><line x1="390.0" y1="99.0" x2="434.0" y2="99.0" stroke="#24101a" stroke-width="2.4" marker-end="url(#p-a)"/><line x1="430.0" y1="153.0" x2="390.0" y2="153.0" stroke="#24101a" stroke-width="1.4" marker-end="url(#p-a)"/><text x="656.0" y="120.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">ápex</text><line x1="570.0" y1="76.0" x2="610.0" y2="76.0" stroke="#f6f3ee" stroke-width="4"/><text x="590.0" y="68.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#c62f3a" text-anchor="middle" font-weight="700">tercera ventana</text><line x1="590.0" y1="100.0" x2="590.0" y2="60.0" stroke="#c62f3a" stroke-width="2.2" marker-end="url(#p-r)"/><line x1="480.0" y1="106.0" x2="480.0" y2="117.0" stroke="#24101a" stroke-width="1.4" marker-end="url(#p-a)"/><line x1="480.0" y1="146.0" x2="480.0" y2="135.0" stroke="#24101a" stroke-width="1.4" marker-end="url(#p-a)"/><text x="215.0" y="50.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">A · Oído sano</text><text x="545.0" y="50.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">B · Con una tercera ventana</text><text x="215.0" y="202.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="middle" font-weight="400">La presión que entra por la ventana oval</text><text x="215.0" y="214.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="middle" font-weight="400">sale por la redonda y, en el camino,</text><text x="215.0" y="226.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="middle" font-weight="400">mueve la membrana basilar con toda su fuerza.</text><text x="545.0" y="202.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="middle" font-weight="400">Parte de la presión se escapa por el tercer orificio:</text><text x="545.0" y="214.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="middle" font-weight="400">llega menos a la membrana basilar por vía aérea</text><text x="545.0" y="226.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="middle" font-weight="400">(la aérea empeora), y por vía ósea se oye mejor.</text><line x1="14.0" y1="244.0" x2="686.0" y2="244.0" stroke="#e7e5e0" stroke-width="1"/><text x="14.0" y="262.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="400">Lo que sigue por la ventana de arriba: el vestíbulo comparte líquido con la cóclea, así que el tercer orificio</text><text x="14.0" y="275.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="400">también deja que el sonido y la presión muevan la endolinfa de los conductos y del sáculo (Tullio, Hennebert, VEMP).</text><text x="14.0" y="318.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Mecánica de la tercera ventana: Merchant y Rosowski (2008).</text></svg>