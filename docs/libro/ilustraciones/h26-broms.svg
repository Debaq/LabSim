 336.5,193.1 340.4,192.1 344.3,191.1 348.2,190.2 352.1,189.2 356.1,188.3 360.0,187.3 363.9,186.4 367.8,185.5 371.7,184.5 375.7,183.6 379.6,182.7 383.5,181.8" fill="none" stroke="#c62f3a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="70.0" y1="305.0" x2="254.3" y2="215.3" stroke="#c62f3a" stroke-width="1.2" stroke-dasharray="3 2"/><circle cx="254.3" cy="215.3" r="4" fill="#c62f3a" stroke="#fff" stroke-width="1.2"/><polyline points="70.0,305.0 73.9,295.4 77.8,287.1 81.8,279.7 85.7,273.0 89.6,266.8 93.5,260.9 97.4,255.4 101.3,250.2 105.3,245.3 109.2,240.5 113.1,236.0 117.0,231.6 120.9,227.4 124.9,223.3 128.8,219.3 132.7,215.4 136.6,211.6 140.5,208.0 144.5,204.4 148.4,200.9 152.3,197.5 156.2,194.1 160.1,190.8 164.1,187.6 168.0,184.5 171.9,181.4 175.8,178.3 179.7,175.3 183.6,172.4 187.6,169.5 191.5,166.6 195.4,163.8 199.3,161.0 203.2,158.3 207.2,155.6 211.1,153.0 215.0,150.3 218.9,147.7 222.8,145.2 226.8,142.7 230.7,140.2 234.6,137.7 238.5,135.2 242.4,132.8 246.3,130.4 250.3,128.1 254.2,125.7 258.1,123.4 262.0,121.1 265.9,118.8 269.9,116.6 273.8,114.4 277.7,112.1 281.6,110.0 285.5,107.8 289.4,105.6 293.4,103.5 297.3,101.4 301.2,99.3 305.1,97.2 309.0,95.1 313.0,93.1 316.9,91.1 320.8,89.0 324.7,87.0 328.6,85.1 332.6,83.1 336.5,81.1 340.4,79.2 344.3,77.2 348.2,75.3 352.1,73.4 356.1,71.5 360.0,69.6 363.9,67.8 367.8,65.9 371.7,64.1 375.7,62.3 379.6,60.4 383.5,58.6" fill="none" stroke="#2b5fa8" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="70.0" y1="305.0" x2="209.0" y2="154.3" stroke="#2b5fa8" stroke-width="1.2" stroke-dasharray="3 2"/><circle cx="209.0" cy="154.3" r="4" fill="#2b5fa8" stroke="#fff" stroke-width="1.2"/><text x="264.3" y="219.3" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#c62f3a" text-anchor="start" font-weight="700">194 Pa · 352 cm³/s</text><text x="264.3" y="231.3" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#c62f3a" text-anchor="start" font-weight="700">R = 0,55 Pa/cm³/s</text><text x="231.0" y="178.3" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#2b5fa8" text-anchor="start" font-weight="700">146 Pa · 591 cm³/s</text><text x="231.0" y="190.3" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#2b5fa8" text-anchor="start" font-weight="700">R = 0,25 Pa/cm³/s</text><text x="440.0" y="70.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.0" fill="#24101a" text-anchor="start" font-weight="700">Cómo se lee</text><text x="440.0" y="90.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="400">1. La curva se traza P contra V, sin tiempo.</text><text x="440.0" y="104.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="400">2. El equipo dibuja un círculo de radio fijo</text><text x="440.0" y="118.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="400">    centrado en el origen.</text><text x="440.0" y="132.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="400">3. Donde el círculo corta la curva hay un punto.</text><text x="440.0" y="146.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="400">4. La resistencia de ese punto es P / V: la</text><text x="440.0" y="160.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="400">    pendiente de la recta que va del origen</text><text x="440.0" y="174.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="400">    al punto. Más empinada, menos resistencia.</text><text x="440.0" y="188.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="400">5. El mismo radio para todos: dos narices se</text><text x="440.0" y="202.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="400">    comparan en una misma "distancia" del</text><text x="440.0" y="216.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="400">    origen, aunque el punto caiga a otra presión.</text><text x="440.0" y="250.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Las dos curvas: R a 150 Pa de 0,50 y 0,25.</text><text x="440.0" y="262.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Los ejes se dibujan a la escala del equipo;</text><text x="440.0" y="274.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">el valor numérico del radio estándar depende de ella.</text></svg>