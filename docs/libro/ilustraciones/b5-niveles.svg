61.0" y2="71.0" stroke="#8a8a90" stroke-width="1.4" marker-end="url(#p-tenue)"/><rect x="162.0" y="40.0" width="125.0" height="62.0" rx="6" fill="#f6f1ea" stroke="#cfccc5" stroke-width="1.2"/><text x="224.5" y="74.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.9" fill="#24101a" text-anchor="middle" font-weight="700">Exposición</text><text x="224.5" y="122.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.0" fill="#8a8a90" text-anchor="middle" font-weight="400">ruido, otitis,</text><text x="224.5" y="134.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.0" fill="#8a8a90" text-anchor="middle" font-weight="400">ototóxicos</text><line x1="288.0" y1="71.0" x2="301.0" y2="71.0" stroke="#8a8a90" stroke-width="1.4" marker-end="url(#p-tenue)"/><rect x="302.0" y="40.0" width="125.0" height="62.0" rx="6" fill="#f6f1ea" stroke="#cfccc5" stroke-width="1.2"/><text x="364.5" y="67.7" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.9" fill="#24101a" text-anchor="middle" font-weight="700">Daño sin</text><text x="364.5" y="81.9" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.9" fill="#24101a" text-anchor="middle" font-weight="700">síntomas</text><text x="364.5" y="122.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.0" fill="#8a8a90" text-anchor="middle" font-weight="400">lesión coclear</text><text x="364.5" y="134.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.0" fill="#8a8a90" text-anchor="middle" font-weight="400">subclínica</text><line x1="428.0" y1="71.0" x2="441.0" y2="71.0" stroke="#8a8a90" stroke-width="1.4" marker-end="url(#p-tenue)"/><rect x="442.0" y="40.0" width="125.0" height="62.0" rx="6" fill="#f6f1ea" stroke="#cfccc5" stroke-width="1.2"/><text x="504.5" y="67.7" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.9" fill="#24101a" text-anchor="middle" font-weight="700">Enfermedad</text><text x="504.5" y="81.9" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.9" fill="#24101a" text-anchor="middle" font-weight="700">con síntomas</text><text x="504.5" y="122.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.0" fill="#8a8a90" text-anchor="middle" font-weight="400">hipoacusia</text><text x="504.5" y="134.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.0" fill="#8a8a90" text-anchor="middle" font-weight="400">que se nota</text><line x1="568.0" y1="71.0" x2="581.0" y2="71.0" stroke="#8a8a90" stroke-width="1.4" marker-end="url(#p-tenue)"/><rect x="582.0" y="40.0" width="125.0" height="62.0" rx="6" fill="#f6f1ea" stroke="#cfccc5" stroke-width="1.2"/><text x="644.5" y="74.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.9" fill="#24101a" text-anchor="middle" font-weight="700">Secuela</text><text x="644.5" y="122.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.0" fill="#8a8a90" text-anchor="middle" font-weight="400">discapacidad</text><text x="644.5" y="134.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.0" fill="#8a8a90" text-anchor="middle" font-weight="400">comunicativa</text><rect x="22.0" y="160.0" width="265.0" height="118.0" rx="6" fill="#fff" stroke="#c0571c" stroke-width="1.6"/><rect x="22.0" y="160.0" width="265.0" height="24.0" rx="6" fill="#c0571c" stroke="#c0571c" stroke-width="1"/><text x="154.5" y="177.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.1" fill="#fff" text-anchor="middle" font-weight="700">Primaria</text><text x="154.5" y="200.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="700">Antes de la enfermedad: evitar que</text><text x="154.5" y="213.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="700">aparezca</text><text x="154.5" y="230.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">Protección auditiva, vacunas, control de</text><text x="154.5" y="242.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">otitis,</text><text x="154.5" y="254.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">límites de volumen en audífonos</text><text x="154.5" y="266.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">personales</text><rect x="302.0" y="160.0" width="125.0" height="118.0" rx="6" fill="#fff" stroke="#2c5cb0" stroke-width="1.6"/><rect x="302.0" y="160.0" width="125.0" height="24.0" rx="6" fill="#2c5cb0" stroke="#2c5cb0" stroke-width="1"/><text x="364.5" y="177.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.1" fill="#fff" text-anchor="middle" font-weight="700">Secundaria</text><text x="364.5" y="200.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="700">Detección precoz</text><text x="364.5" y="217.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">Tamizaje neonatal,</text><text x="364.5" y="229.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">audiometría</text><text x="364.5" y="241.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">de vigilancia</text><rect x="442.0" y="160.0" width="265.0" height="118.0" rx="6" fill="#fff" stroke="#21796c" stroke-width="1.6"/><rect x="442.0" y="160.0" width="265.0" height="24.0" rx="6" fill="#21796c" stroke="#21796c" stroke-width="1"/><text x="574.5" y="177.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.1" fill="#fff" text-anchor="middle" font-weight="700">Terciaria</text><text x="574.5" y="200.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="700">Limitar el daño y rehabilitar</text><text x="574.5" y="217.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">Audífono, implante coclear,</text><text x="574.5" y="229.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">rehabilitación auditiva</text><rect x="22.0" y="300.0" width="685.0" height="76.0" rx="6" fill="#faf3f3" stroke="#c62f3a" stroke-width="1.6"/><rect x="22.0" y="300.0" width="685.0" height="24.0" rx="6" fill="#c62f3a" stroke="#c62f3a" stroke-width="1"/><text x="380.0" y="317.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.1" fill="#fff" text-anchor="middle" font-weight="700">Cuaternaria: en todas las etapas</text><text x="380.0" y="343.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.6" fill="#24101a" text-anchor="middle" font-weight="700">Proteger a la persona del exceso de medicina: sobrediagnóstico, sobretratamiento y exámenes que no cambian la conducta.</text><text x="380.0" y="360.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">Ejemplo: pedir una resonancia por un acúfeno simétrico, sin otros signos, que no cambia lo que se hará.</text></svg>