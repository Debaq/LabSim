<line x1="460.0" y1="136.0" x2="640.0" y2="176.0" stroke="#8a8a90" stroke-width="1.4" stroke-linecap="round" marker-end="url(#pf)"/>
<rect x="20.0" y="176.0" width="220.0" height="56.0" rx="6" fill="#fff" stroke="#21796c" stroke-width="1.3"/>
<text x="130.0" y="196.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#21796c" text-anchor="middle" font-weight="400">Arriba + torsional,</text>
<text x="130.0" y="208.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#21796c" text-anchor="middle" font-weight="400">con latencia, &lt; 1 min,</text>
<text x="130.0" y="220.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#21796c" text-anchor="middle" font-weight="400">se invierte al sentarse</text>
<rect x="270.0" y="176.0" width="220.0" height="56.0" rx="6" fill="#fff" stroke="#2b5fa8" stroke-width="1.3"/>
<text x="380.0" y="202.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#2b5fa8" text-anchor="middle" font-weight="400">Horizontal, o nada,</text>
<text x="380.0" y="214.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#2b5fa8" text-anchor="middle" font-weight="400">con síntomas de posición</text>
<rect x="520.0" y="176.0" width="220.0" height="56.0" rx="6" fill="#fff" stroke="#c62f3a" stroke-width="1.3"/>
<text x="630.0" y="196.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#c62f3a" text-anchor="middle" font-weight="400">Abajo puro, sin latencia,</text>
<text x="630.0" y="208.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#c62f3a" text-anchor="middle" font-weight="400">no se cansa, o signos</text>
<text x="630.0" y="220.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#c62f3a" text-anchor="middle" font-weight="400">neurológicos</text>
<line x1="130.0" y1="232.0" x2="130.0" y2="262.0" stroke="#21796c" stroke-width="1.4" stroke-linecap="round" marker-end="url(#pf)"/>
