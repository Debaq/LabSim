<rect x="270.0" y="250.0" width="220.0" height="36.0" rx="6" fill="#fff" stroke="#2b5fa8" stroke-width="1.3"/>
<text x="380.0" y="272.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#2b5fa8" text-anchor="middle" font-weight="700">Giro supino (roll test)</text>
<line x1="330.0" y1="286.0" x2="240.0" y2="318.0" stroke="#2b5fa8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#pf)"/>
<line x1="430.0" y1="286.0" x2="450.0" y2="318.0" stroke="#2b5fa8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#pf)"/>
<rect x="130.0" y="318.0" width="190.0" height="64.0" rx="6" fill="#f2f6fb" stroke="#2b5fa8" stroke-width="1.3"/>
<text x="225.0" y="342.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#2b5fa8" text-anchor="middle" font-weight="400">Geotrópico</text>
<text x="225.0" y="354.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#2b5fa8" text-anchor="middle" font-weight="400">lado más fuerte = afectado</text>
<text x="225.0" y="366.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#2b5fa8" text-anchor="middle" font-weight="400">Lempert o Gufoni canalar</text>
<rect x="340.0" y="318.0" width="190.0" height="64.0" rx="6" fill="#f2f6fb" stroke="#2b5fa8" stroke-width="1.3"/>
<text x="435.0" y="342.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#2b5fa8" text-anchor="middle" font-weight="400">Apogeotrópico</text>
<text x="435.0" y="354.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#2b5fa8" text-anchor="middle" font-weight="400">lado más débil = afectado</text>
<text x="435.0" y="366.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#2b5fa8" text-anchor="middle" font-weight="400">Gufoni cupular</text>
<line x1="435.0" y1="382.0" x2="435.0" y2="404.0" stroke="#2b5fa8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#pf)"/>
<rect x="340.0" y="404.0" width="190.0" height="40.0" rx="6" fill="#fff" stroke="#2b5fa8" stroke-width="1.3"/>
<text x="435.0" y="422.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#2b5fa8" text-anchor="middle" font-weight="400">Repetir el giro supino:</text>
<text x="435.0" y="434.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#2b5fa8" text-anchor="middle" font-weight="400">si pasa a geotrópico, canalar</text>
<line x1="630.0" y1="232.0" x2="630.0" y2="262.0" stroke="#c62f3a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#pf)"/>
<rect x="550.0" y="262.0" width="190.0" height="76.0" rx="6" fill="#fdf1f2" stroke="#c62f3a" stroke-width="1.3"/>
<text x="645.0" y="286.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#c62f3a" text-anchor="middle" font-weight="700">No es un VPPB típico</text>
<text x="645.0" y="298.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#c62f3a" text-anchor="middle" font-weight="400">No se hacen maniobras</text>
<text x="645.0" y="310.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#c62f3a" text-anchor="middle" font-weight="400">Examen neurológico</text>
<text x="645.0" y="322.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#c62f3a" text-anchor="middle" font-weight="400">Derivar</text>
