<text x="380.0" y="114.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#24101a" text-anchor="middle" font-weight="700">Dix-Hallpike</text>
<text x="380.0" y="126.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#24101a" text-anchor="middle" font-weight="400">(canales verticales)</text>
