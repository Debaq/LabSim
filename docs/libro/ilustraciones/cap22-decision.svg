<text x="130.0" y="279.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#21796c" text-anchor="middle" font-weight="700">Canalitiasis del posterior</text>
<text x="130.0" y="291.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#21796c" text-anchor="middle" font-weight="400">del oído de abajo</text>
<text x="130.0" y="303.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#21796c" text-anchor="middle" font-weight="400">Epley (Semont si cupular)</text>
