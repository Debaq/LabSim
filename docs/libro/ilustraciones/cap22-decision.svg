<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
<rect width="760" height="470" fill="#fff"/>
<defs><marker id="pf" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a8a90"/></marker></defs>
<text x="14.0" y="20.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#24101a" text-anchor="start" font-weight="700">Del hallazgo a la maniobra (o a la derivación)</text>
<rect x="250.0" y="36.0" width="260.0" height="40.0" rx="6" fill="#fff" stroke="#24101a" stroke-width="1.3"/>
<text x="380.0" y="54.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#24101a" text-anchor="middle" font-weight="700">Vértigo breve al acostarse o girar</text>
<text x="380.0" y="66.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#24101a" text-anchor="middle" font-weight="400">Se examinan los dos lados</text>
<line x1="380.0" y1="76.0" x2="380.0" y2="96.0" stroke="#8a8a90" stroke-width="1.4" stroke-linecap="round" marker-end="url(#pf)"/>
