<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330"><rect width="700" height="330" fill="#fff"/><text x="14.0" y="20.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.6" fill="#24101a" text-anchor="start" font-weight="700">Tres tonos, dos posibilidades: lo que cambia es el orden</text><text x="70.0" y="46.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#5b4f72" text-anchor="start" font-weight="700">A · Patrón de frecuencia</text><text x="70.0" y="62.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#8a8a90" text-anchor="start" font-weight="400">mismo largo, dos tonos</text><line x1="70.0" y1="172.0" x2="370.0" y2="172.0" stroke="#cfccc5" stroke-width="1"/><text x="370.0" y="186.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.0" fill="#8a8a90" text-anchor="end" font-weight="400">tiempo</text><line x1="70.0" y1="172.0" x2="70.0" y2="80.0" stroke="#cfccc5" stroke-width="1"/><text x="66.0" y="100.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.0" fill="#8a8a90" text-anchor="end" font-weight="400">agudo</text><text x="66.0" y="154.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.0" fill="#8a8a90" text-anchor="end" font-weight="400">grave</text><rect x="90.0" y="141.0" width="34.0" height="18.0" rx="3" fill="#efeaf5" stroke="#5b4f72" stroke-width="1.5"/><text x="107.0" y="202.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.2" fill="#5b4f72" text-anchor="middle" font-weight="700">G</text><rect x="148.0" y="91.0" width="34.0" height="18.0" rx="3" fill="#efeaf5" stroke="#5b4f72" stroke-width="1.5"/><text x="165.0" y="202.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.2" fill="#5b4f72" text-anchor="middle" font-weight="700">A</text><rect x="206.0" y="141.0" width="34.0" height="18.0" rx="3" fill="#efeaf5" stroke="#5b4f72" stroke-width="1.5"/><text x="223.0" y="202.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.2" fill="#5b4f72" text-anchor="middle" font-weight="700">G</text><text x="70.0" y="228.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#24101a" text-anchor="start" font-weight="400">el paciente dice: «grave, agudo, grave»</text><text x="400.0" y="46.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#5b4f72" text-anchor="start" font-weight="700">B · Patrón de duración</text><text x="400.0" y="62.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#8a8a90" text-anchor="start" font-weight="400">mismo tono, dos largos</text><line x1="400.0" y1="172.0" x2="700.0" y2="172.0" stroke="#cfccc5" stroke-width="1"/><text x="700.0" y="186.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.0" fill="#8a8a90" text-anchor="end" font-weight="400">tiempo</text><line x1="400.0" y1="172.0" x2="400.0" y2="80.0" stroke="#cfccc5" stroke-width="1"/><rect x="420.0" y="141.0" width="78.0" height="18.0" rx="3" fill="#efeaf5" stroke="#5b4f72" stroke-width="1.5"/><text x="459.0" y="202.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.2" fill="#5b4f72" text-anchor="middle" font-weight="700">L</text><rect x="522.0" y="141.0" width="34.0" height="18.0" rx="3" fill="#efeaf5" stroke="#5b4f72" stroke-width="1.5"/><text x="539.0" y="202.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.2" fill="#5b4f72" text-anchor="middle" font-weight="700">C</text><rect x="580.0" y="141.0" width="78.0" height="18.0" rx="3" fill="#efeaf5" stroke="#5b4f72" stroke-width="1.5"/><text x="619.0" y="202.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.2" fill="#5b4f72" text-anchor="middle" font-weight="700">L</text><text x="400.0" y="228.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#24101a" text-anchor="start" font-weight="400">el paciente dice: «largo, corto, largo»</text><line x1="14.0" y1="250.0" x2="686.0" y2="250.0" stroke="#e7e5e0" stroke-width="1"/><text x="14.0" y="270.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="700">Las seis secuencias (sin las dos que repiten el mismo tono):</text><rect x="14.0" y="280.0" width="52.0" height="22.0" rx="3" fill="#f6f4ef" stroke="#cfccc5" stroke-width="1"/><text x="40.0" y="296.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="700">GGA</text><rect x="74.0" y="280.0" width="52.0" height="22.0" rx="3" fill="#f6f4ef" stroke="#cfccc5" stroke-width="1"/><text x="100.0" y="296.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="700">GAG</text><rect x="134.0" y="280.0" width="52.0" height="22.0" rx="3" fill="#f6f4ef" stroke="#cfccc5" stroke-width="1"/><text x="160.0" y="296.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="700">AGG</text><rect x="194.0" y="280.0" width="52.0" height="22.0" rx="3" fill="#f6f4ef" stroke="#cfccc5" stroke-width="1"/><text x="220.0" y="296.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="700">AAG</text><rect x="254.0" y="280.0" width="52.0" height="22.0" rx="3" fill="#f6f4ef" stroke="#cfccc5" stroke-width="1"/><text x="280.0" y="296.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="700">AGA</text><rect x="314.0" y="280.0" width="52.0" height="22.0" rx="3" fill="#f6f4ef" stroke="#cfccc5" stroke-width="1"/><text x="340.0" y="296.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="700">GAA</text><text x="400.0" y="272.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="700">Dos errores distintos sobre GAG:</text><text x="400.0" y="290.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#c62f3a" text-anchor="start" font-weight="400">GGA → cambio de lugar («dónde»)</text><text x="400.0" y="306.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#c62f3a" text-anchor="start" font-weight="400">AGA → inversión de todo («qué»)</text><text x="14.0" y="324.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.8" fill="#8a8a90" text-anchor="start" font-weight="400">Esquema, no datos. G: grave; A: agudo; L: largo; C: corto. Frecuencias, duraciones y pausas son las de cada versión.</text></svg>