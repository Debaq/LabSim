t-weight="400" >el oído sano oye poco a quien habla</text><text x="120" y="216" font-size="9.5" fill="#8a8a90" text-anchor="middle" font-weight="400" >desde el lado sordo</text><text x="290" y="16" font-size="12.5" fill="#1d1d1f" text-anchor="start" font-weight="700" >B · CROS: el micrófono va en el lado sordo</text><circle cx="410" cy="120" r="46" fill="#fbfaf8" stroke="#55555b" stroke-width="1.4"/><path d="M403,75 L410,62 L417,75" fill="none" stroke="#55555b" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="360" cy="120" rx="5" ry="12" fill="#ffffff" stroke="#2c5cb0" stroke-width="2"/><text x="360" y="148" font-size="11" fill="#2c5cb0" text-anchor="middle" font-weight="700" >OI</text><text x="360" y="159" font-size="9.5" fill="#2c5cb0" text-anchor="middle" font-weight="400" >normal</text><ellipse cx="460" cy="120" rx="5" ry="12" fill="#ffffff" stroke="#c62f3a" stroke-width="2"/><text x="460" y="148" font-size="11" fill="#c62f3a" text-anchor="middle" font-weight="700" >OD</text><text x="460" y="159" font-size="9.5" fill="#c62f3a" text-anchor="middle" font-weight="400" >sordo</text><circle cx="550" cy="116" r="9" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.6"/><circle cx="550" cy="116" r="3" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="1"/><text x="550" y="100" font-size="9.5" fill="#1d1d1f" text-anchor="middle" font-weight="400" >voz</text><path d="M540,116 L473,117" fill="none" stroke="#c62f3a" stroke-width="1.6" stroke-opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><rect x="465" y="111" width="7" height="18" fill="#c62f3a" stroke="#c62f3a" stroke-width="1" /><rect x="348" y="111" width="7" height="18" fill="#2c5cb0" stroke="#2c5cb0" stroke-width="1" /><path d="M468,110 Q410,34 352,110" fill="none" stroke="#2e8540" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="410" y="48" font-size="9.5" fill="#2e8540" text-anchor="middle" font-weight="600" >enlace inalámbrico</text><text x="480" y="111" font-size="9.5" fill="#c62f3a" text-anchor="start" font-weight="600" >micrófono</text><text x="336" y="124" font-size="9.5" fill="#2c5cb0" text-anchor="end" font-weight="600" >receptor</text><text x="410" y="206" font-size="9.5" fill="#8a8a90" text-anchor="middle" font-weight="400" >el sonido del lado sordo se oye</text><text x="410" y="216" font-size="9.5" fill="#8a8a90" text-anchor="middle" font-weight="400" >por el oído sano (conducto abierto)</text><text x="590" y="244" font-size="9.5" fill="#8a8a90" text-anchor="end" font-weight="400" >Esquema de principio, sin escala.</text></svg>