chor="middle" font-weight="600">Tálamo y corteza</text><text x="610.0" y="322.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#6b3fa0" text-anchor="middle" font-weight="600">vestibular</text><line x1="460.0" y1="218.0" x2="520.0" y2="313.0" stroke="#6b3fa0" stroke-width="1.8" marker-end="url(#fl6b3fa0)" stroke-linecap="round"/><text x="490.0" y="299.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#24101a" text-anchor="middle" font-weight="400"></text><text x="612.0" y="344.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#24101a" text-anchor="middle" font-weight="400"></text><rect x="520.0" y="370.0" width="180" height="56" rx="6" fill="#fff" stroke="#6b6b72" stroke-width="1.2"/><text x="610.0" y="395.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#6b6b72" text-anchor="middle" font-weight="600">Formación reticular</text><text x="610.0" y="407.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#6b6b72" text-anchor="middle" font-weight="600">y núcleo del vago</text><line x1="460.0" y1="218.0" x2="520.0" y2="398.0" stroke="#6b6b72" stroke-width="1.8" marker-end="url(#fl6b6b72)" stroke-linecap="round"/><text x="490.0" y="384.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#24101a" text-anchor="middle" font-weight="400"></text><text x="612.0" y="429.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#24101a" text-anchor="middle" font-weight="400"></text><text x="610.0" y="99.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#6b6b72" text-anchor="middle" font-weight="400">reflejo vestíbulo-ocular</text><text x="610.0" y="184.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#6b6b72" text-anchor="middle" font-weight="400">postura y equilibrio</text><text x="610.0" y="269.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#6b6b72" text-anchor="middle" font-weight="400">calibra 