<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330"><rect width="720" height="330" fill="#fff"/><text x="360.0" y="22.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#24101a" text-anchor="middle" font-weight="700">Los cinco criterios de la Sociedad Bárány, aplicados a los tres casos</text><text x="415.0" y="46.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#24101a" text-anchor="middle" font-weight="700">Victoria</text><text x="415.0" y="60.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#8a8a90" text-anchor="middle" font-weight="400">neuritis</text><text x="525.0" y="46.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#24101a" text-anchor="middle" font-weight="700">Eva</text><text x="525.0" y="60.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#8a8a90" text-anchor="middle" font-weight="400">VPPB</text><text x="635.0" y="46.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#24101a" text-anchor="middle" font-weight="700">Joaquín</text><text x="635.0" y="60.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#8a8a90" text-anchor="middle" font-weight="400">oído izquierdo</text><rect x="14.0" y="74.0" width="700.0" height="40.0" rx="4" fill="#8a8a90" fill-opacity="0.06" stroke="none"/><circle cx="40.0" cy="94.0" r="12" fill="#24101a" stroke="none" stroke-width="1"/><text x="40.0" y="98.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">A</text><text x="62.0" y="98.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#24101a" text-anchor="start" font-weight="400">Síntomas casi todos los días, 3 meses o más</text><circle cx="415.0" cy="94.0" r="12" fill="#21796c" stroke="none" stroke-width="1"/><polyline points="410.0,94.0 414.0,98.0 421.0,89.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="525.0" cy="94.0" r="12" fill="#21796c" stroke="none" stroke-width="1"/><polyline points="520.0,94.0 524.0,98.0 531.0,89.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="635.0" cy="94.0" r="12" fill="#21796c" stroke="none" stroke-width="1"/><polyline points="630.0,94.0 634.0,98.0 641.0,89.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="40.0" cy="140.0" r="12" fill="#24101a" stroke="none" stroke-width="1"/><text x="40.0" y="144.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">B</text><text x="62.0" y="144.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#24101a" text-anchor="start" font-weight="400">Peor de pie, al moverse o con mucho estímulo visual</text><circle cx="415.0" cy="140.0" r="12" fill="#21796c" stroke="none" stroke-width="1"/><polyline points="410.0,140.0 414.0,144.0 421.0,135.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="525.0" cy="140.0" r="12" fill="#21796c" stroke="none" stroke-width="1"/><polyline points="520.0,140.0 524.0,144.0 531.0,135.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="635.0" cy="140.0" r="12" fill="#c62f3a" stroke="none" stroke-width="1"/><line x1="630.0" y1="135.0" x2="640.0" y2="145.0" stroke="#fff" stroke-width="2.4"/><line x1="630.0" y1="145.0" x2="640.0" y2="135.0" stroke="#fff" stroke-width="2.4"/><rect x="14.0" y="166.0" width="700.0" height="40.0" rx="4" fill="#8a8a90" fill-opacity="0.06" stroke="none"/><circle cx="40.0" cy="186.0" r="12" fill="#24101a" stroke="none" stroke-width="1"/><text x="40.0" y="190.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">C</text><text x="62.0" y="190.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#24101a" text-anchor="start" font-weight="400">Empezó tras una enfermedad o un evento que mareó</text><circle cx="415.0" cy="186.0" r="12" fill="#21796c" stroke="none" stroke-width="1"/><polyline points="410.0,186.0 414.0,190.0 421.0,181.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="525.0" cy="186.0" r="12" fill="#21796c" stroke="none" stroke-width="1"/><polyline points="520.0,186.0 524.0,190.0 531.0,181.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="635.0" cy="186.0" r="12" fill="#c62f3a" stroke="none" stroke-width="1"/><line x1="630.0" y1="181.0" x2="640.0" y2="191.0" stroke="#fff" stroke-width="2.4"/><line x1="630.0" y1="191.0" x2="640.0" y2="181.0" stroke="#fff" stroke-width="2.4"/><circle cx="40.0" cy="232.0" r="12" fill="#24101a" stroke="none" stroke-width="1"/><text x="40.0" y="236.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">D</text><text x="62.0" y="236.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#24101a" text-anchor="start" font-weight="400">Molestia importante o limitación</text><circle cx="415.0" cy="232.0" r="12" fill="#21796c" stroke="none" stroke-width="1"/><polyline points="410.0,232.0 414.0,236.0 421.0,227.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="525.0" cy="232.0" r="12" fill="#21796c" stroke="none" stroke-width="1"/><polyline points="520.0,232.0 524.0,236.0 531.0,227.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="635.0" cy="232.0" r="12" fill="#21796c" stroke="none" stroke-width="1"/><polyline points="630.0,232.0 634.0,236.0 641.0,227.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><rect x="14.0" y="258.0" width="700.0" height="40.0" rx="4" fill="#8a8a90" fill-opacity="0.06" stroke="none"/><circle cx="40.0" cy="278.0" r="12" fill="#24101a" stroke="none" stroke-width="1"/><text x="40.0" y="282.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">E</text><text x="62.0" y="282.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#24101a" text-anchor="start" font-weight="400">No se explica mejor por otra enfermedad</text><circle cx="415.0" cy="278.0" r="12" fill="#21796c" stroke="none" stroke-width="1"/><polyline points="410.0,278.0 414.0,282.0 421.0,273.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="525.0" cy="278.0" r="12" fill="#21796c" stroke="none" stroke-width="1"/><polyline points="520.0,278.0 524.0,282.0 531.0,273.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="635.0" cy="278.0" r="12" fill="#c62f3a" stroke="none" stroke-width="1"/><line x1="630.0" y1="273.0" x2="640.0" y2="283.0" stroke="#fff" stroke-width="2.4"/><line x1="630.0" y1="283.0" x2="640.0" y2="273.0" stroke="#fff" stroke-width="2.4"/><text x="360.0" y="318.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8a8a90" text-anchor="middle" font-weight="400">Joaquín no cumple B, C ni E: sus síntomas empeoran a oscuras y su oído izquierdo explica el cuadro (caso 27.3).</text></svg>