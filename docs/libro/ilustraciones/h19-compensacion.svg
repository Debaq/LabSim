ound"/><text x="473.2" y="294.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="middle" font-weight="400">1 mes</text><line x1="565.8" y1="60.0" x2="565.8" y2="280.0" stroke="#e7e5e0" stroke-width="1" stroke-linecap="round"/><text x="565.8" y="294.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="middle" font-weight="400">3 meses</text><text x="330.0" y="310.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="middle" font-weight="400">tiempo desde la lesión (escala logarítmica)</text><text x="62.0" y="64.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8a8a90" text-anchor="end" font-weight="400">recuperado</text><text x="62.0" y="280.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8a8a90" text-anchor="end" font-weight="400">nada</text><polyline points="70.0,262.4 76.5,260.2 82.5,260.2 88.1,258.0 95.9,255.8 103.0,253.6 109.6,253.6 115.7,251.4 121.4,249.2 128.4,247.0 134.9,244.8 140.9,240.4 147.8,238.2 154.3,236.0 160.3,231.6 166.9,229.4 174.1,225.0 180.7,220.6 186.8,218.4 193.2,214.0 200.0,209.6 206.2,205.2 212.7,200.8 219.2,194.2 225.8,189.8 232.0,185.4 238.6,178.8 245.1,172.2 251.6,167.8 258.0,161.2 264.6,154.6 271.0,148.0 277.3,143.6 283.9,137.0 290.3,130.4 297.0,123.8 303.3,117.2 309.8,112.8 316.4,106.2 322.8,101.8 329.3,95.2 335.8,90.8 342.2,86.4 348.7,82.0 355.2,79.8 361.7,75.4 368.2,73.2 374.7,68.8 381.1,68.8 387.7,66.6 394.1,64.4 400.6,62.2 407.1,62.2 413.6,62.2 420.0,60.0 426.5,60.0 433.0,60.0 439.5,60.0 446.0,60.0 452.5,60.0 458.9,60.0 465.4,60.0 471.9,60.0 478.4,60.0 484.9,60.0 491.3,60.0 497.8,60.0 504.3,60.0 510.8,60.0 517.3,60.0 523.8,60.0 530.2,60.0 536.7,60.0 543.2,60.0 549.7,60.0 556.2,60.0 562.7,60.0 569.1,60.0 575.6,60.0 582.1,60.0 588.6,60.0" fill="none" stroke="#21796c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="70.0,277.8 76.5,277.8 82.5,2