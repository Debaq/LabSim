a90" text-anchor="start" font-weight="400" font-style="italic">estar seguro</text><text x="425.0" y="40.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.4" fill="#24101a" text-anchor="start" font-weight="400">El umbral es el nivel con</text><text x="425.0" y="54.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.4" fill="#24101a" text-anchor="start" font-weight="700">50 % de detecciones.</text><text x="425.0" y="83.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.4" fill="#24101a" text-anchor="start" font-weight="400">En la clínica se estima así:</text><text x="425.0" y="98.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.4" fill="#24101a" text-anchor="start" font-weight="400">el nivel más bajo con respuesta</text><text x="425.0" y="112.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.4" fill="#24101a" text-anchor="start" font-weight="400">en la mitad de los ascensos,</text><text x="425.0" y="127.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.4" fill="#24101a" text-anchor="start" font-weight="700">mínimo 2 de 3.</text><text x="425.0" y="156.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.4" fill="#24101a" text-anchor="start" font-weight="400">Si el paciente espera a estar</text><text x="425.0" y="170.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.4" fill="#24101a" text-anchor="start" font-weight="400">seguro, la curva se corre a la</text><text x="425.0" y="185.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.4" fill="#24101a" text-anchor="start" font-weight="400">derecha (línea punteada) y los</text><text x="425.0" y="199.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.4" fill="#24101a" text-anchor="start" font-weight="400">umbrales salen peores.</text><text x="425.0" y="246.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#8a8a90" text-anchor="start" font-weight="400" font-style="italic">La pendiente cambia con la persona.</text></svg>