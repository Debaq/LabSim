/><rect x="458.2" y="142.9" width="10.3" height="131.1" fill="#21796c"/><rect x="472.9" y="99.2" width="10.3" height="174.8" fill="#21796c"/><rect x="487.5" y="156.7" width="10.3" height="117.3" fill="#21796c"/><text x="60.0" y="318.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Verde: noche con 4 h o más de uso. Gris: menos de 4 h (incluye 3 noches sin uso).</text><rect x="524" y="44" width="222" height="50" rx="6" fill="#faf8f4" stroke="#cfccc5" stroke-width="1"/><text x="534.0" y="61.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">Uso promedio</text><text x="534.0" y="84.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="18.0" fill="#24101a" text-anchor="start" font-weight="700">5,3 h</text><text x="736.0" y="84.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="end" font-weight="400">de las 30 noches</text><rect x="524" y="102" width="222" height="50" rx="6" fill="#faf8f4" stroke="#cfccc5" stroke-width="1"/><text x="534.0" y="119.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">Noches con ≥ 4 h</text><text x="534.0" y="142.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="18.0" fill="#24101a" text-anchor="start" font-weight="700">23 de 30</text><text x="736.0" y="142.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="end" font-weight="400">(77 %)</text><rect x="524" y="160" width="222" height="50" rx="6" fill="#faf8f4" stroke="#cfccc5" stroke-width="1"/><text x="534.0" y="177.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">IAH residual</text><text x="534.0" y="200.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="18.0" fill="#24101a" text-anchor="start" font-weight="700">3,1</text><text x="736.0" y="200.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="end" font-weight="400">eventos por hora</text><rect x="524" y="218" width="222" height="50" rx="6" fill="#faf8f4" stroke="#cfccc5" stroke-width="1"/><text x="534.0" y="235.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">Fuga no intencional</text><text x="534.0" y="258.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="18.0" fill="#24101a" text-anchor="start" font-weight="700">11 L/min</text><text x="736.0" y="258.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="end" font-weight="400">percentil 95</text><text x="524.0" y="290.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="400">Modo: CPAP fijo, 10 cmH₂O</text><text x="524.0" y="303.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="400">Interfaz: mascarilla nasal</text><text x="524.0" y="316.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="400">Humidificador: nivel 3</text><text x="14.0" y="346.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">El límite de fuga aceptable depende de la interfaz y del fabricante del equipo; el valor del ejemplo es ilustrativo.</text><text x="14.0" y="360.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Las cifras salen de las 30 barras: promedio de todas las noches, incluidas las de cero horas.</text></svg>