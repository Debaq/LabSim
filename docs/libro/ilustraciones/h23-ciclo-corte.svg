arta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">flujo grueso = fosa más abierta</text><text x="520.0" y="306.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">flujo fino = fosa más cerrada</text><text x="335.0" y="160.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="26.4" fill="#8a8a90" text-anchor="middle" font-weight="700">⇄</text><text x="14.0" y="322.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Esquema: la alternancia ocurre en el tejido eréctil del cornete inferior. Proporciones ilustrativas.</text><text x="150.0" y="74.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#24101a" text-anchor="middle" font-weight="600">tabique</text><text x="335.0" y="200.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#c0571c" text-anchor="middle" font-weight="600">cornetes en naranja:</text><text x="335.0" y="212.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#c0571c" text-anchor="middle" font-weight="600">medio arriba, inferior abajo</text></svg>