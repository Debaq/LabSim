<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300"><defs><marker id="p-corr" markerWidth="6" markerHeight="6" refX="4" refY="3.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" transform="scale(.8)" fill="#c62f3a"/></marker></defs><rect width="700" height="300" fill="#fff"/><text x="14.0" y="20.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.6" fill="#24101a" text-anchor="start" font-weight="700">Del umbral del ASSR al audiograma estimado (recién nacido, fonos de inserción)</text><line x1="90.0" y1="48.0" x2="420.0" y2="48.0" stroke="#e7e5e0" stroke-width="0.6"/><text x="82.0" y="51.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-weight="400">0</text><line x1="90.0" y1="86.0" x2="420.0" y2="86.0" stroke="#e7e5e0" stroke-width="0.6"/><text x="82.0" y="89.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-weight="400">20</text><line x1="90.0" y1="124.0" x2="420.0" y2="124.0" stroke="#e7e5e0" stroke-width="0.6"/><text x="82.0" y="127.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-weight="400">40</text><line x1="90.0" y1="162.0" x2="420.0" y2="162.0" stroke="#e7e5e0" stroke-width="0.6"/><text x="82.0" y="165.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-weight="400">60</text><line x1="90.0" y1="200.0" x2="420.0" y2="200.0" stroke="#e7e5e0" stroke-width="0.6"/><text x="82.0" y="203.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-weight="400">80</text><line x1="90.0" y1="238.0" x2="420.0" y2="238.0" stroke="#e7e5e0" stroke-width="0.6"/><text x="82.0" y="241.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-weight="400">100</text><text x="135.0" y="40.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">500</text><text x="215.0" y="40.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">1000</text><text x="295.0" y="40.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">2000</text><text x="375.0" y="40.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">4000</text><text x="255.0" y="256.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">frecuencia (Hz)</text><text x="36.0" y="143.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">dB</text><line x1="135.0" y1="175.0" x2="135.0" y2="149.0" stroke="#c62f3a" stroke-width="1.4" marker-end="url(#p-corr)"/><circle cx="135.0" cy="181.0" r="4.5" fill="#fff" stroke="#8a8a90" stroke-width="1.6"/><rect x="130.5" y="138.5" width="9" height="9" fill="#c0571c"/><text x="147.0" y="165.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#c62f3a" text-anchor="start" font-weight="700">−20</text><line x1="215.0" y1="165.5" x2="215.0" y2="139.5" stroke="#c62f3a" stroke-width="1.4" marker-end="url(#p-corr)"/><circle cx="215.0" cy="171.5" r="4.5" fill="#fff" stroke="#8a8a90" stroke-width="1.6"/><rect x="210.5" y="129.0" width="9" height="9" fill="#c0571c"/><text x="227.0" y="155.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#c62f3a" text-anchor="start" font-weight="700">−20</text><line x1="295.0" y1="156.0" x2="295.0" y2="139.5" stroke="#c62f3a" stroke-width="1.4" marker-end="url(#p-corr)"/><circle cx="295.0" cy="162.0" r="4.5" fill="#fff" stroke="#8a8a90" stroke-width="1.6"/><rect x="290.5" y="129.0" width="9" height="9" fill="#c0571c"/><text x="307.0" y="150.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#c62f3a" text-anchor="start" font-weight="700">−15</text><line x1="375.0" y1="156.0" x2="375.0" y2="139.5" stroke="#c62f3a" stroke-width="1.4" marker-end="url(#p-corr)"/><circle cx="375.0" cy="162.0" r="4.5" fill="#fff" stroke="#8a8a90" stroke-width="1.6"/><rect x="370.5" y="129.0" width="9" height="9" fill="#c0571c"/><text x="387.0" y="150.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#c62f3a" text-anchor="start" font-weight="700">−15</text><polyline points="135.0,143.0 215.0,133.5 295.0,133.5 375.0,133.5" fill="none" stroke="#c0571c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="470" cy="80" r="4.5" fill="#fff" stroke="#8a8a90" stroke-width="1.6"/><text x="482.0" y="83.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="start" font-weight="400">umbral del ASSR (dB nHL)</text><rect x="465.5" y="102.5" width="9" height="9" fill="#c0571c"/><text x="482.0" y="111.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="start" font-weight="400">audiograma estimado (dB eHL)</text><line x1="470.0" y1="150.0" x2="470.0" y2="134.0" stroke="#c62f3a" stroke-width="1.4" marker-end="url(#p-corr)"/><text x="482.0" y="146.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="start" font-weight="400">corrección que se resta</text><text x="464.0" y="182.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="start" font-weight="600">Ejemplo: 70 − 20 = 50 dB eHL en 500 Hz.</text><text x="464.0" y="196.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">Correcciones de BSA (2023), recién nacido</text><text x="464.0" y="208.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">hasta 12 semanas, fonos de inserción:</text><text x="464.0" y="220.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="start" font-weight="400">500 y 1000 Hz: −20 · 2000 y 4000 Hz: −15.</text><text x="14.0" y="292.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Las correcciones valen solo para umbrales sobre 30 dB eHL.</text></svg>