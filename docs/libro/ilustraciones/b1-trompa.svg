<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330"><defs></defs><rect width="700" height="330" fill="#fff"/><text x="20.0" y="22.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#24101a" text-anchor="start" font-weight="700">Lactante</text><text x="20.0" y="38.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#6b6b72" text-anchor="start" font-weight="400">más corta y más cerca de la horizontal</text><line x1="40.0" y1="100.0" x2="320.0" y2="100.0" stroke="#6b6b72" stroke-width="1" stroke-dasharray="4 4" stroke-linecap="round"/><line x1="40.0" y1="100.0" x2="57.3" y2="103.1" stroke="#b9a37a" stroke-width="14" stroke-linecap="round"/><line x1="57.3" y1="103.1" x2="197.6" y2="127.8" stroke="#7fb3d5" stroke-width="14" stroke-linecap="round"/><ellipse cx="34" cy="100" rx="26" ry="30" fill="#f7e9e4" stroke="#8a5a4a" stroke-width="1.4"/><text x="34.0" y="103.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#6b6b72" text-anchor="middle" font-weight="400">oído</text><path d="M193.6,113.8 L237.6,113.8 L237.6,197.8 L193.6,177.8" fill="#f3dede" stroke="#8a5a4a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" /><text x="215.6" y="151.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#6b6b72" text-anchor="middle" font-weight="400">rino-</text><text x="215.6" y="162.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#6b6b72" text-anchor="middle" font-weight="400">faringe</text><text x="118.8" y="147.9" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#24101a" text-anchor="middle" font-weight="600">largo ≈ 21 mm (3 meses)</text><text x="360.0" y="22.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#24101a" text-anchor="start" font-weight="700">Adulto</text><text x="360.0" y="38.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#6b6b72" text-anchor="start" font-weight="400"