.</text><text x="14.0" y="336.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="start" font-weight="400">Con la presión positiva la luz queda a presión mayor que la atmosférica durante todo el ciclo: funciona como una férula neumática. Esquema; las proporciones son aproximadas.</text></svg>