<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440"><defs><marker id="pr" markerWidth="8" markerHeight="8" refX="6" refY="4" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c62f3a"/></marker><marker id="pa" markerWidth="8" markerHeight="8" refX="6" refY="4" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2b5fa8"/></marker><marker id="pt" markerWidth="8" markerHeight="8" refX="6" refY="4" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24101a"/></marker><marker id="pv" markerWidth="8" markerHeight="8" refX="6" refY="4" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#21796c"/></marker><marker id="pg" markerWidth="8" markerHeight="8" refX="6" refY="4" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a8a90"/></marker></defs><rect width="760" height="440" fill="#fff"/><text x="14.0" y="22.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#24101a" text-anchor="start" font-weight="700">Del relato al riesgo: cuándo hace falta una evaluación multifactorial</text><text x="14.0" y="38.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8a8a90" text-anchor="start" font-weight="400">Resumen de la estratificación de las Guías Mundiales de Caídas (Montero-Odasso y cols., 2022). Es una guía de decisión, no un puntaje.</text><rect x="14.0" y="56.0" width="732.0" height="74.0" rx="8" fill="#fff" stroke="#24101a" stroke-width="1.4"/><text x="24.0" y="74.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#24101a" text-anchor="start" font-weight="700">Se pregunta a todo mayor:</text><text x="24.0" y="90.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.8" fill="#24101a" text-anchor="start" font-weight="400">¿Se cayó en el último año?  ¿Tiene mareo, pérdida del conocimiento o dificultad para caminar o mantener el equilibrio?</text><text x="24.0" y="104.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.8" fill="#24101a" text-anchor="start" font-weight="400">Si hay más tiempo: ¿el miedo a caer le hace dejar actividades?  Si responde que sí a algo, se mide la marcha:</text><text x="24.0" y="118.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.8" fill="#24101a" text-anchor="start" font-weight="400">velocidad de marcha (corte: menos de 0,8 m/s) o, como alternativa, el TUG (corte: más de 15 s).</text><rect x="14.0" y="156.0" width="236.0" height="168.0" rx="8" fill="#faf9f6" stroke="#21796c" stroke-width="1.6"/><rect x="14.0" y="156.0" width="236.0" height="24.0" rx="8" fill="#21796c" stroke="none" stroke-width="0"/><rect x="14.0" y="170.0" width="236.0" height="10.0" rx="0" fill="#21796c" stroke="none" stroke-width="0"/><text x="132.0" y="173.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="700">Riesgo bajo</text><text x="24.0" y="198.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">Sin caídas, o una sola caída</text><text x="24.0" y="211.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">no grave, y sin problema de</text><text x="24.0" y="224.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">marcha ni de equilibrio.</text><text x="24.0" y="237.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400"></text><text x="24.0" y="250.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">Prevención: actividad física y</text><text x="24.0" y="263.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">consejo. Se revisa cada año.</text><rect x="262.0" y="156.0" width="236.0" height="168.0" rx="8" fill="#faf9f6" stroke="#b8741a" stroke-width="1.6"/><rect x="262.0" y="156.0" width="236.0" height="24.0" rx="8" fill="#b8741a" stroke="none" stroke-width="0"/><rect x="262.0" y="170.0" width="236.0" height="10.0" rx="0" fill="#b8741a" stroke="none" stroke-width="0"/><text x="380.0" y="173.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="700">Riesgo intermedio</text><text x="272.0" y="198.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">Una sola caída no grave, pero</text><text x="272.0" y="211.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">con problema de marcha o de</text><text x="272.0" y="224.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">equilibrio.</text><text x="272.0" y="237.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400"></text><text x="272.0" y="250.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">Ejercicio de fuerza y de equilibrio</text><text x="272.0" y="263.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">(→ Otago, Tai Chi).</text><rect x="510.0" y="156.0" width="236.0" height="168.0" rx="8" fill="#faf9f6" stroke="#c62f3a" stroke-width="1.6"/><rect x="510.0" y="156.0" width="236.0" height="24.0" rx="8" fill="#c62f3a" stroke="none" stroke-width="0"/><rect x="510.0" y="170.0" width="236.0" height="10.0" rx="0" fill="#c62f3a" stroke="none" stroke-width="0"/><text x="628.0" y="173.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="700">Riesgo alto</text><text x="520.0" y="198.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">Una caída y además alguna de estas:</text><text x="520.0" y="211.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">- lesión que requirió atención</text><text x="520.0" y="224.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">- dos o más caídas en 12 meses</text><text x="520.0" y="237.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">- fragilidad conocida</text><text x="520.0" y="250.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">- no poder levantarse en una hora</text><text x="520.0" y="263.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.6" fill="#24101a" text-anchor="start" font-weight="400">- sospecha de pérdida del conocimiento</text><line x1="251.0" y1="240.0" x2="261.0" y2="240.0" stroke="#8a8a90" stroke-width="1.4" stroke-linecap="round" marker-end="url(#pg)"/><line x1="499.0" y1="240.0" x2="509.0" y2="240.0" stroke="#8a8a90" stroke-width="1.4" stroke-linecap="round" marker-end="url(#pg)"/><rect x="510.0" y="338.0" width="236.0" height="62.0" rx="8" fill="#fff" stroke="#c62f3a" stroke-width="1.4"/><text x="628.0" y="358.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#c62f3a" text-anchor="middle" font-weight="700">Evaluación multifactorial</text><text x="628.0" y="371.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#c62f3a" text-anchor="middle" font-weight="700">y plan con varios frentes</text><text x="628.0" y="384.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#c62f3a" text-anchor="middle" font-weight="700">(si hubo síncope, se estudia aparte)</text><line x1="628.0" y1="324.0" x2="628.0" y2="338.0" stroke="#c62f3a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#pr)"/><text x="14.0" y="360.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#24101a" text-anchor="start" font-weight="700">Eva, Hugo e Isabel (casos 32.1 a 32.3)</text><text x="14.0" y="376.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#24101a" text-anchor="start" font-weight="400">cumplen una o más de las condiciones de la caja roja:</text><text x="14.0" y="389.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#24101a" text-anchor="start" font-weight="400">por eso no basta con "entrenar el equilibrio".</text><text x="380.0" y="430.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="middle" font-weight="400">La estratificación decide cuánto estudiar; el ejercicio de equilibrio le sirve a todos.</text></svg>