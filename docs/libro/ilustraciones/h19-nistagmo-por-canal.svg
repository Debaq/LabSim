<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560"><defs><marker id="pr" markerWidth="8" markerHeight="8" refX="6" refY="4" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c62f3a"/></marker><marker id="pv" markerWidth="8" markerHeight="8" refX="6" refY="4" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#21796c"/></marker></defs><rect width="760" height="560" fill="#fff"/><text x="14.0" y="22.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#24101a" text-anchor="start" font-weight="700">Qué se ve en los ojos, según el canal y la postura</text><text x="14.0" y="38.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="start" font-weight="400">Visto por el examinador: el oído derecho del paciente (aquí, el enfermo) queda a la izquierda. Flechas rojas = fase rápida; verde = polo superior del ojo.</text><text x="14.0" y="76.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#24101a" text-anchor="start" font-weight="700">Posterior</text><text x="14.0" y="92.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="start" font-weight="400">Dix-Hallpike hacia el lado enfermo</text><text x="14.0" y="106.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="start" font-weight="400">canalitiasis (el más frecuente)</text><circle cx="292" cy="100" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="292" cy="100" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="292" cy="100" r="9.120000000000001" fill="#24101a"/><circle cx="288" cy="96" r="2" fill="#fff"/><circle cx="368" cy="100" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="368" cy="100" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="368" cy="100" r="9.120000000000001" fill="#24101a"/><circle cx="364" cy="96" r="2" fill="#fff"/><circle cx="522" cy="100" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="522" cy="100" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="522" cy="100" r="9.120000000000001" fill="#24101a"/><circle cx="518" cy="96" r="2" fill="#fff"/><circle cx="598" cy="100" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="598" cy="100" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="598" cy="100" r="9.120000000000001" fill="#24101a"/><circle cx="594" cy="96" r="2" fill="#fff"/><line x1="330.0" y1="130.0" x2="330.0" y2="70.0" stroke="#c62f3a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#pr)"/><path d="M311.5,72.1 A34,34 0 0 0 272.5,72.1" fill="none" stroke="#21796c" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pv)"/><path d="M387.5,72.1 A34,34 0 0 0 348.5,72.1" fill="none" stroke="#21796c" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pv)"/><text x="330.0" y="147.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8a8a90" text-anchor="middle" font-weight="400">Hallpike, oído enfermo abajo</text><line x1="560.0" y1="70.0" x2="560.0" y2="130.0" stroke="#d08a90" stroke-width="1.6" stroke-linecap="round" marker-end="url(#pr)"/><text x="560.0" y="147.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8a8a90" text-anchor="middle" font-weight="400">al sentarse: se invierte, más suave</text><line x1="14.0" y1="146.0" x2="746.0" y2="146.0" stroke="#e7e5e0" stroke-width="1" stroke-linecap="round"/><text x="14.0" y="174.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#24101a" text-anchor="start" font-weight="700">Anterior</text><text x="14.0" y="190.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="start" font-weight="400">Dix-Hallpike o cabeza colgando</text><text x="14.0" y="204.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="start" font-weight="400">raro; cuidado con el central</text><circle cx="292" cy="198" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="292" cy="198" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="292" cy="198" r="9.120000000000001" fill="#24101a"/><circle cx="288" cy="194" r="2" fill="#fff"/><circle cx="368" cy="198" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="368" cy="198" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="368" cy="198" r="9.120000000000001" fill="#24101a"/><circle cx="364" cy="194" r="2" fill="#fff"/><line x1="330.0" y1="168.0" x2="330.0" y2="228.0" stroke="#c62f3a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#pr)"/><path d="M311.5,170.1 A34,34 0 0 0 272.5,170.1" fill="none" stroke="#21796c" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pv)"/><path d="M387.5,170.1 A34,34 0 0 0 348.5,170.1" fill="none" stroke="#21796c" stroke-width="2.2" stroke-linecap="round" marker-end="url(#pv)"/><text x="330.0" y="245.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8a8a90" text-anchor="middle" font-weight="400">hacia abajo, con o sin torsión</text><text x="560.0" y="194.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="middle" font-weight="400">al sentarse: invierte</text><text x="560.0" y="208.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="middle" font-weight="400">(hacia arriba, más suave)</text><line x1="14.0" y1="244.0" x2="746.0" y2="244.0" stroke="#e7e5e0" stroke-width="1" stroke-linecap="round"/><text x="14.0" y="272.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#24101a" text-anchor="start" font-weight="700">Lateral geotrópico</text><text x="14.0" y="288.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="start" font-weight="400">giro supino, cabeza al lado enfermo</text><text x="14.0" y="302.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="start" font-weight="400">hacia el oído de abajo; mayor del lado enfermo</text><circle cx="292" cy="296" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="292" cy="296" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="292" cy="296" r="9.120000000000001" fill="#24101a"/><circle cx="288" cy="292" r="2" fill="#fff"/><circle cx="368" cy="296" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="368" cy="296" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="368" cy="296" r="9.120000000000001" fill="#24101a"/><circle cx="364" cy="292" r="2" fill="#fff"/><circle cx="522" cy="296" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="522" cy="296" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="522" cy="296" r="9.120000000000001" fill="#24101a"/><circle cx="518" cy="292" r="2" fill="#fff"/><circle cx="598" cy="296" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="598" cy="296" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="598" cy="296" r="9.120000000000001" fill="#24101a"/><circle cx="594" cy="292" r="2" fill="#fff"/><line x1="390.0" y1="332.0" x2="270.0" y2="332.0" stroke="#c62f3a" stroke-width="3.0" stroke-linecap="round" marker-end="url(#pr)"/><text x="330.0" y="343.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8a8a90" text-anchor="middle" font-weight="400">rueda al lado enfermo (OD): fuerte</text><line x1="500.0" y1="332.0" x2="620.0" y2="332.0" stroke="#d08a90" stroke-width="1.6" stroke-linecap="round" marker-end="url(#pr)"/><text x="560.0" y="343.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8a8a90" text-anchor="middle" font-weight="400">rueda al lado sano (OI): más débil</text><line x1="14.0" y1="342.0" x2="746.0" y2="342.0" stroke="#e7e5e0" stroke-width="1" stroke-linecap="round"/><text x="14.0" y="370.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#24101a" text-anchor="start" font-weight="700">Lateral apogeotrópico</text><text x="14.0" y="386.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="start" font-weight="400">giro supino, cabeza al lado sano</text><text x="14.0" y="400.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="start" font-weight="400">hacia el oído de arriba; mayor del lado sano</text><circle cx="292" cy="394" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="292" cy="394" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="292" cy="394" r="9.120000000000001" fill="#24101a"/><circle cx="288" cy="390" r="2" fill="#fff"/><circle cx="368" cy="394" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="368" cy="394" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="368" cy="394" r="9.120000000000001" fill="#24101a"/><circle cx="364" cy="390" r="2" fill="#fff"/><circle cx="522" cy="394" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="522" cy="394" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="522" cy="394" r="9.120000000000001" fill="#24101a"/><circle cx="518" cy="390" r="2" fill="#fff"/><circle cx="598" cy="394" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="598" cy="394" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="598" cy="394" r="9.120000000000001" fill="#24101a"/><circle cx="594" cy="390" r="2" fill="#fff"/><line x1="270.0" y1="430.0" x2="390.0" y2="430.0" stroke="#d08a90" stroke-width="1.6" stroke-linecap="round" marker-end="url(#pr)"/><text x="330.0" y="441.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8a8a90" text-anchor="middle" font-weight="400">rueda al lado enfermo (OD): débil</text><line x1="620.0" y1="430.0" x2="500.0" y2="430.0" stroke="#c62f3a" stroke-width="3.0" stroke-linecap="round" marker-end="url(#pr)"/><text x="560.0" y="441.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8a8a90" text-anchor="middle" font-weight="400">rueda al lado sano (OI): fuerte</text><line x1="14.0" y1="440.0" x2="746.0" y2="440.0" stroke="#e7e5e0" stroke-width="1" stroke-linecap="round"/><text x="14.0" y="468.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#c62f3a" text-anchor="start" font-weight="700">Alerta: central</text><text x="14.0" y="484.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="start" font-weight="400">al acostarse, sin latencia</text><text x="14.0" y="498.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="start" font-weight="400">vertical puro, que no se cansa</text><circle cx="292" cy="492" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="292" cy="492" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="292" cy="492" r="9.120000000000001" fill="#24101a"/><circle cx="288" cy="488" r="2" fill="#fff"/><circle cx="368" cy="492" r="29" fill="#faf8f4" stroke="#8a8a90" stroke-width="1"/><circle cx="368" cy="492" r="21" fill="#a9825a" stroke="#24101a" stroke-width="1"/><circle cx="368" cy="492" r="9.120000000000001" fill="#24101a"/><circle cx="364" cy="488" r="2" fill="#fff"/><line x1="330.0" y1="462.0" x2="330.0" y2="522.0" stroke="#c62f3a" stroke-width="3.0" stroke-linecap="round" marker-end="url(#pr)"/><text x="330.0" y="539.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#8a8a90" text-anchor="middle" font-weight="400">hacia abajo, sin torsión</text><text x="560.0" y="488.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="middle" font-weight="400">sin latencia, sin fatiga,</text><text x="560.0" y="502.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="middle" font-weight="400">persiste con la postura</text></svg>