0" width="14.0" height="76.0" rx="4" fill="#fff" stroke="#24101a" stroke-width="1.4"/><rect x="122.0" y="98.0" width="16.0" height="16.0" rx="3" fill="#d9d4c8" stroke="#24101a" stroke-width="1.2"/><rect x="183.0" y="112.0" width="14.0" height="76.0" rx="4" fill="#f4c27a" stroke="#24101a" stroke-width="1.4"/><rect x="182.0" y="98.0" width="16.0" height="16.0" rx="3" fill="#d9d4c8" stroke="#24101a" stroke-width="1.2"/><text x="130.0" y="206.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">solvente</text><text x="70.0" y="206.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">solvente</text><text x="190.0" y="206.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#c0571c" text-anchor="middle" font-weight="700">olor diluido</text><text x="130.0" y="232.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">¿Cuál huele?</text><text x="130.0" y="247.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">Sube o baja la concentración</text><text x="130.0" y="260.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">puntaje 1 a 16</text><rect x="264.0" y="34.0" width="232.0" height="232.0" rx="8" fill="#fff" stroke="#cfccc5" stroke-width="1.2"/><text x="380.0" y="54.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.6" fill="#24101a" text-anchor="middle" font-weight="700">Discriminación (D)</text><text x="380.0" y="70.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">Tres bolígrafos: dos iguales y uno distinto.</text><rect x="313.0" y="112.0" width="14.0" height="76.0" rx="4" fill="#f4c27a" stroke="#24101a" stroke-width="1.4"/><rect x="312.0" y="98.0" width="16.0" height="16.0" rx="3" fill="#d9d4c8" stroke="#24101a" stroke-width="1.2"/><rect x="373.0" y="112.0" width="14.0" height="76.0" rx="4" fill="#9ccfc6" stroke="#24101a" stroke-width="1.4"/><rect x="372.0" y="98.0" width="16.0" height="16.0" rx="3" fill="#d9d4c8" stroke="#24101a" stroke-width="1.2"/><rect x="433.0" y="112.0" width="14.0" height="76.0" rx="4" fill="#f4c27a" stroke="#24101a" stroke-width="1.4"/><rect x="432.0" y="98.0" width="16.0" height="16.0" rx="3" fill="#d9d4c8" stroke="#24101a" stroke-width="1.2"/><text x="320.0" y="206.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#c0571c" text-anchor="middle" font-weight="700">olor A</text><text x="380.0" y="206.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#21796c" text-anchor="middle" font-weight="700">olor B</text><text x="440.0" y="206.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#c0571c" text-anchor="middle" font-weight="700">olor A</text><text x="380.0" y="232.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">¿Cuál es el distinto?</text><text x="380.0" y="247.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">Olores bien por encima del umbral</text><text x="380.0" y="260.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">puntaje 0 a 16</text><rect x="514.0" y="34.0" width="232.0" height="232.0" rx="8" fill="#fff" stroke="#cfccc5" stroke-width="1.2"/><text x="630.0" y="54.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.6" fill="#24101a" text-anchor="middle" font-weight="700">Identificación (I)</text><text x="630.0" y="70.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">Un bolígrafo y cuatro opciones escritas.</text><rect x="559.0" y="112.0" width="14.0" height="76.0" rx="4" fill="#d6b8e6" stroke="#24101a" stroke-width="1.4"/><rect x="558.0" y="98.0" width="16.0" height="16.0" rx="3" fill="#d9d4c8" stroke="#24101a" stroke-width="1.2"/><rect x="614.0" y="112.0" width="112.0" height="19.0" rx="4" fill="#fff" stroke="#8a8a90" stroke-width="1.1"/><text x="670.0" y="125.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="middle" font-weight="400">café</text><rect x="614.0" y="136.0" width="112.0" height="19.0" rx="4" fill="#fff" stroke="#8a8a90" stroke-width="1.1"/><text x="670.0" y="149.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="middle" font-weight="400">canela</text><rect x="614.0" y="160.0" width="112.0" height="19.0" rx="4" fill="#fff" stroke="#8a8a90" stroke-width="1.1"/><text x="670.0" y="173.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="middle" font-weight="400">ajo</text><rect x="614.0" y="184.0" width="112.0" height="19.0" rx="4" fill="#fff" stroke="#8a8a90" stroke-width="1.1"/><text x="670.0" y="197.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="middle" font-weight="400">pescado</text><text x="566.0" y="206.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">olor desconocido</text><text x="630.0" y="232.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">¿Qué olor es?</text><text x="630.0" y="247.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">Olores familiares, elección múltiple</text><text x="630.0" y="260.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="middle" font-weight="400">puntaje 0 a 16</text><rect x="14.0" y="280.0" width="732.0" height="56.0" rx="8" fill="#f3f1ec" stroke="none" stroke-width="0"/><text x="380.0" y="298.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.6" fill="#24101a" text-anchor="middle" font-weight="700">TDI = T + D + I   (1 a 48 puntos)</text><text x="380.0" y="314.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#24101a" text-anchor="middle" font-weight="400">T depende más del epitelio y de la vía periférica; D e I dependen más de la memoria y de la cognición.</text><text x="380.0" y="328.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">Por eso una misma enfermedad puede alterar más un subpuntaje que otro.</text></svg>