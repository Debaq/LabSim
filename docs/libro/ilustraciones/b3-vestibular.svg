6.0" y="144.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.4" fill="#24101a" text-anchor="start" font-weight="400">gel</text><line x1="740.0" y1="190.0" x2="802.0" y2="190.0" stroke="#6b6b72" stroke-width="0.8" stroke-linecap="round"/><text x="806.0" y="194.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.4" fill="#24101a" text-anchor="start" font-weight="400">haces ciliares</text><line x1="760.0" y1="235.0" x2="802.0" y2="235.0" stroke="#6b6b72" stroke-width="0.8" stroke-linecap="round"/><text x="806.0" y="239.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.4" fill="#24101a" text-anchor="start" font-weight="400">epitelio</text><text x="650.0" y="330.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#6b6b72" text-anchor="middle" font-weight="400">Las otoconias se apoyan en el gel,</text><text x="650.0" y="346.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#6b6b72" text-anchor="middle" font-weight="400">no en el epitelio</text><text x="650.0" y="380.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#6b6b72" text-anchor="middle" font-weight="400">La cúpula de la cresta cubre las células</text><text x="650.0" y="396.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#6b6b72" text-anchor="middle" font-weight="400">como un gel, sin otoconias.</text><rect x="40.0" y="450.0" width="820.0" height="90.0" rx="4" fill="#faf7f2" stroke="#e7e5e0" stroke-width="1"/><text x="60.0" y="474.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#24101a" text-anchor="start" font-weight="400">Al nacer, la razón tipo I : tipo II es 2,4 : 1 en las crestas y 1,3 : 1 en las máculas (Merchant y cols., 2000).</text><text x="60.0" y="496.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#24101a" text-anchor="start" font-weight="400">Las tipo I se pierden con la edad más rápido en las crestas que en las máculas; las tipo II, al mismo ritmo.</text><text x="60.0" y="518.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#24101a" text-anchor="start" font-weight="400">Las fibras que solo forman cálices están en la zona central de la cresta y en la estriola (Eatock y Songer, 2011).</text></svg>