round" stroke-dasharray="4 3"/><rect x="508.0" y="276.0" width="238.0" height="52.0" rx="8" fill="#faf9f6" stroke="#b8741a" stroke-width="1.6"/><rect x="508.0" y="276.0" width="6.0" height="52.0" rx="3" fill="#b8741a" stroke="none" stroke-width="0"/><text x="526.0" y="298.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#b8741a" text-anchor="start" font-weight="700">Cognición y ánimo</text><text x="526.0" y="316.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#24101a" text-anchor="start" font-weight="400">atención, depresión, delirio</text><line x1="508.0" y1="302.0" x2="442.0" y2="269.2" stroke="#b8741a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/><rect x="508.0" y="338.0" width="238.0" height="52.0" rx="8" fill="#faf9f6" stroke="#b8741a" stroke-width="1.6"/><rect x="508.0" y="338.0" width="6.0" height="52.0" rx="3" fill="#b8741a" stroke="none" stroke-width="0"/><text x="526.0" y="360.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#b8741a" text-anchor="start" font-weight="700">Casa y calle</text><text x="526.0" y="378.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#24101a" text-anchor="start" font-weight="400">luz, alfombras, escaleras</text><line x1="508.0" y1="364.0" x2="442.0" y2="280.4" stroke="#b8741a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/><text x="380.0" y="458.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8a8a90" text-anchor="middle" font-weight="400">Ningún dominio basta solo: se miran todos, se tratan los que se pueden tratar y se avisa a quien corresponde.</text></svg>