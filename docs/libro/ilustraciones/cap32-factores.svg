<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470"><defs><marker id="pr" markerWidth="8" markerHeight="8" refX="6" refY="4" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c62f3a"/></marker><marker id="pa" markerWidth="8" markerHeight="8" refX="6" refY="4" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2b5fa8"/></marker><marker id="pt" markerWidth="8" markerHeight="8" refX="6" refY="4" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#24101a"/></marker><marker id="pv" markerWidth="8" markerHeight="8" refX="6" refY="4" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#21796c"/></marker><marker id="pg" markerWidth="8" markerHeight="8" refX="6" refY="4" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a8a90"/></marker></defs><rect width="760" height="470" fill="#fff"/><text x="14.0" y="22.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#24101a" text-anchor="start" font-weight="700">Una caída casi nunca tiene una sola causa</text><text x="14.0" y="38.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.2" fill="#8a8a90" text-anchor="start" font-weight="400">Dominios de la evaluación multifactorial (Guías Mundiales 2022). En azul, lo que mide quien evalúa la audición y el equilibrio; en naranja, lo que se pregunta, se mide a pie de cama o se deriva.</text><rect x="318.0" y="220.0" width="124.0" height="84.0" rx="10" fill="#fff" stroke="#24101a" stroke-width="1.6"/><text x="380.0" y="254.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#24101a" text-anchor="middle" font-weight="700">La caída</text><text x="380.0" y="272.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#24101a" text-anchor="middle" font-weight="700">y el mareo</text><rect x="14.0" y="62.0" width="238.0" height="52.0" rx="8" fill="#faf9f6" stroke="#2b5fa8" stroke-width="1.6"/><rect x="14.0" y="62.0" width="6.0" height="52.0" rx="3" fill="#2b5fa8" stroke="none" stroke-width="0"/><text x="32.0" y="84.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#2b5fa8" text-anchor="start" font-weight="700">Audición</text><text x="32.0" y="102.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#24101a" text-anchor="start" font-weight="400">audiograma, discriminación (→ cap. 5)</text><line x1="252.0" y1="88.0" x2="318.0" y2="230.7" stroke="#2b5fa8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/><rect x="14.0" y="124.0" width="238.0" height="52.0" rx="8" fill="#faf9f6" stroke="#2b5fa8" stroke-width="1.6"/><rect x="14.0" y="124.0" width="6.0" height="52.0" rx="3" fill="#2b5fa8" stroke="none" stroke-width="0"/><text x="32.0" y="146.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#2b5fa8" text-anchor="start" font-weight="700">Vestíbulo</text><text x="32.0" y="164.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#24101a" text-anchor="start" font-weight="400">VPPB, hipofunción (→ cap. 22, 24)</text><line x1="252.0" y1="150.0" x2="318.0" y2="241.8" stroke="#2b5fa8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/><rect x="14.0" y="186.0" width="238.0" height="52.0" rx="8" fill="#faf9f6" stroke="#2b5fa8" stroke-width="1.6"/><rect x="14.0" y="186.0" width="6.0" height="52.0" rx="3" fill="#2b5fa8" stroke="none" stroke-width="0"/><text x="32.0" y="208.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#2b5fa8" text-anchor="start" font-weight="700">Equilibrio y marcha</text><text x="32.0" y="226.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#24101a" text-anchor="start" font-weight="400">TUG, DGI, mCTSIB (→ H19)</text><line x1="252.0" y1="212.0" x2="318.0" y2="253.0" stroke="#2b5fa8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/><rect x="14.0" y="248.0" width="238.0" h