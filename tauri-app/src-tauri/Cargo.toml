[workspace]
members = [".", "crates/sidecar-llm", "crates/sidecar-speech"]
resolver = "2"

[package]
name = "labsim"
version = "3.1.3"
description = "LabSim - Plataforma de Simulación Clínica Educativa"
authors = ["Nicolás Baier Quezada"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }
cc = "1"

[dependencies]
# Tauri
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

# Serialización
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Base de datos
rusqlite = { version = "0.34", features = ["bundled"] }

# Audio
cpal = "0.15"
rand = "0.9"

# Model downloads (TTS)
hf-hub = "0.4"

# IPC with sidecars (LLM + Speech run as separate processes)
base64 = "0.22"

# TTS (Piper via ONNX)
piper-rs = "0.1"
ort = "=2.0.0-rc.9"
ort-sys = "=2.0.0-rc.9"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }

# Utilidades
log = "0.4"
bcrypt = "0.17"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "2.0"

